<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MARSHMELLO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Lora&family=Space+Mono&family=Pacifico&family=Caveat&family=Fredoka&family=Press+Start+2P&display=swap">
<style>
/* Layout: one framed "screen" inside the page. Desktop surface with icons and floating windows, taskbar along the bottom, start menu above it. */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --page:#c9d1dc; --panel:rgba(248,250,253,.82); --panel-solid:#f6f8fb; --win:#fbfcfd; --win-bar:#eaeef4;
  --fg:#18202e; --muted:#5a6578; --line:#d5dbe5; --hover:rgba(24,32,46,.07); --sel:rgba(47,109,246,.14);
  --accent:#2f6df6; --accent-fg:#ffffff; --term-bg:#0f141c; --term-fg:#d6dfec; --bad:#d6453d; --ok:#1f9d63;
  --r-owner:#a8650d; --r-coowner:#c2410c; --r-admin:#b42318; --r-mod:#16794a; --r-member:#5a6578;
  --shadow:0 18px 44px rgba(10,18,36,.32),0 2px 6px rgba(10,18,36,.18);
  --wall-tide:radial-gradient(120% 90% at 85% 10%,rgba(160,215,200,.55),transparent 60%),linear-gradient(135deg,#1c3556 0%,#2c6486 50%,#5fa595 100%);
  --wall-dusk:radial-gradient(110% 90% at 15% 0%,rgba(240,170,110,.5),transparent 60%),linear-gradient(140deg,#281f4b 0%,#7a3a69 55%,#d98a58 100%);
  --wall-moss:radial-gradient(100% 80% at 90% 0%,rgba(190,205,150,.4),transparent 60%),linear-gradient(135deg,#17241e 0%,#35523f 55%,#8da57a 100%);
  --wall-slate:linear-gradient(135deg,#1c2028 0%,#38414f 55%,#69758a 100%);
  --wall-aurora:radial-gradient(90% 70% at 20% 10%,rgba(120,255,200,.5),transparent 60%),radial-gradient(80% 60% at 85% 20%,rgba(150,120,255,.5),transparent 60%),linear-gradient(160deg,#0b1d2e,#12354a 55%,#1d5a63);
  --wall-sakura:radial-gradient(80% 70% at 85% 10%,rgba(255,255,255,.45),transparent 60%),linear-gradient(135deg,#ffd6e5,#f7a8c4 55%,#d77aa5);
  --wall-ember:radial-gradient(100% 80% at 80% 100%,rgba(255,150,60,.6),transparent 60%),linear-gradient(160deg,#2a0f0f,#5b1d12 55%,#a8431c);
  --wall-ocean:linear-gradient(180deg,#0a3a5c,#0f6a8f 55%,#5ec3d6);
  --wall-neon:radial-gradient(70% 60% at 15% 20%,rgba(255,60,200,.5),transparent 60%),radial-gradient(70% 60% at 85% 80%,rgba(60,200,255,.5),transparent 60%),linear-gradient(135deg,#120b2e,#24104d);
  --wall-sand:radial-gradient(90% 70% at 80% 10%,rgba(255,255,255,.4),transparent 60%),linear-gradient(135deg,#8c6a4a,#c9a779 55%,#efd9ac);
  --wall-forest:radial-gradient(90% 70% at 15% 0%,rgba(150,220,150,.35),transparent 60%),linear-gradient(150deg,#06190f,#12402a 55%,#2f7a4d);
  --wall-twilight:radial-gradient(90% 70% at 80% 0%,rgba(255,170,200,.4),transparent 60%),linear-gradient(160deg,#10163a,#3a2f78 55%,#8f5aa8);
  --wall-lagoon:radial-gradient(80% 70% at 10% 90%,rgba(120,255,230,.45),transparent 60%),linear-gradient(135deg,#053b49,#0a7a85 55%,#4fd1c5);
  --wall-rose:radial-gradient(90% 70% at 90% 10%,rgba(255,220,230,.45),transparent 60%),linear-gradient(140deg,#4a1130,#a02a5c 55%,#e46a8f);
  --wall-ice:radial-gradient(90% 70% at 20% 0%,rgba(255,255,255,.6),transparent 60%),linear-gradient(160deg,#bcd7ee,#8fb5d8 55%,#5d88b5);
  --wall-sunset:radial-gradient(110% 80% at 50% 110%,rgba(255,210,100,.6),transparent 60%),linear-gradient(180deg,#2b1b4a,#b0436a 55%,#ff9a56);
  --wall-graphite:radial-gradient(90% 70% at 85% 0%,rgba(255,255,255,.12),transparent 60%),linear-gradient(135deg,#0b0d12,#1a1f2a 55%,#2e3646);
  --wall-autumn:radial-gradient(90% 70% at 85% 10%,rgba(255,205,120,.5),transparent 60%),linear-gradient(145deg,#3b1a0d,#9a4a1a 55%,#e29a3c);
  --wall-frost:radial-gradient(90% 70% at 20% 0%,rgba(255,255,255,.55),transparent 60%),linear-gradient(160deg,#16314f,#4d7fb0 55%,#cfe5f7);
  --wall-spooky:radial-gradient(70% 60% at 85% 15%,rgba(255,140,30,.55),transparent 60%),linear-gradient(160deg,#0d0618,#2a0f46 55%,#5a1f64);
  --wall-bloom:radial-gradient(90% 70% at 85% 10%,rgba(255,255,255,.5),transparent 60%),linear-gradient(140deg,#7fc99a,#c9e8a9 50%,#f7b6d2);
  --wall-splash:radial-gradient(90% 70% at 15% 10%,rgba(255,240,150,.55),transparent 60%),linear-gradient(160deg,#0b6fa8,#19b0d6 55%,#7de2d1);
  --wall-mono:linear-gradient(135deg,#101010,#2b2b2b 55%,#555);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#080b11; --panel:rgba(21,26,35,.82); --panel-solid:#171c26; --win:#1a202b; --win-bar:#232a38;
  --fg:#e5eaf2; --muted:#93a0b4; --line:#2d3545; --hover:rgba(229,234,242,.08); --sel:rgba(120,160,255,.2);
  --shadow:0 18px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#080b11; --panel:rgba(21,26,35,.82); --panel-solid:#171c26; --win:#1a202b; --win-bar:#232a38;
  --fg:#e5eaf2; --muted:#93a0b4; --line:#2d3545; --hover:rgba(229,234,242,.08); --sel:rgba(120,160,255,.2);
  --shadow:0 18px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;display:flex;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#screen{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:14px;
  border:1px solid var(--line);background:var(--wall-tide)}
#screen[data-wall="tide"]{background:var(--wall-tide)}
#screen[data-wall="dusk"]{background:var(--wall-dusk)}
#screen[data-wall="moss"]{background:var(--wall-moss)}
#screen[data-wall="slate"]{background:var(--wall-slate)}
#screen[data-wall="aurora"]{background:var(--wall-aurora)}
#screen[data-wall="sakura"]{background:var(--wall-sakura)}
#screen[data-wall="ember"]{background:var(--wall-ember)}
#screen[data-wall="ocean"]{background:var(--wall-ocean)}
#screen[data-wall="neon"]{background:var(--wall-neon)}
#screen[data-wall="mono"]{background:var(--wall-mono)}
#screen[data-wall="sand"]{background:var(--wall-sand)}
#screen[data-wall="forest"]{background:var(--wall-forest)}
#screen[data-wall="twilight"]{background:var(--wall-twilight)}
#screen[data-wall="lagoon"]{background:var(--wall-lagoon)}
#screen[data-wall="rose"]{background:var(--wall-rose)}
#screen[data-wall="ice"]{background:var(--wall-ice)}
#screen[data-wall="sunset"]{background:var(--wall-sunset)}
#screen[data-wall="graphite"]{background:var(--wall-graphite)}
#screen[data-wall="autumn"]{background:var(--wall-autumn)}
#screen[data-wall="frost"]{background:var(--wall-frost)}
#screen[data-wall="spooky"]{background:var(--wall-spooky)}
#screen[data-wall="bloom"]{background:var(--wall-bloom)}
#screen[data-wall="splash"]{background:var(--wall-splash)}
#desk{flex:1;min-height:0;position:relative;overflow:hidden}

#mark{position:absolute;right:24px;bottom:18px;z-index:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);pointer-events:none;user-select:none}
#mark b{font-size:34px;font-weight:600;letter-spacing:.02em;opacity:.7}
#mark span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
@media (max-width:560px){#mark b{font-size:24px}}
#icons{position:absolute;inset:0;z-index:1;padding:12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.dicon{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1px solid transparent;border-radius:10px;
  background:none;color:#fff;cursor:pointer;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dicon .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px)}
.dicon:hover{background:rgba(255,255,255,.1)}
.dicon.on{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}

.win{position:absolute;display:flex;flex-direction:column;min-width:260px;min-height:160px;background:var(--win);border:1px solid var(--line);border-radius:var(--winr,10px);box-shadow:var(--shadow);overflow:hidden;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.win:not(.focus) .tb{opacity:.72}
.win.min{display:none}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0;border:0}
.tb{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;background:var(--win-bar);border-bottom:1px solid var(--line);user-select:none;touch-action:none}
.ti{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:13px}
.ti b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ctl{display:flex;gap:2px}
.ctl button{width:30px;height:26px;border:0;background:none;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.ctl button:hover{background:var(--hover)}
.ctl .x:hover{background:var(--bad);color:#fff}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 52%,var(--muted) 52% 58%,transparent 58% 70%,var(--muted) 70% 76%,transparent 76%);opacity:.6}
.win.max .rs{display:none}

#bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);position:relative;z-index:5000}
#start{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
#tasks{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.task{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;white-space:nowrap;max-width:190px;flex:none}
.task span{overflow:hidden;text-overflow:ellipsis}
.task:hover{background:var(--hover)}
.task.on{background:var(--sel);border-color:var(--accent)}
.task.min{opacity:.6}
#clock{font-size:12px;line-height:1.3;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
#clock b{display:block;color:var(--fg);font-weight:600;font-size:13px}

#menu{position:absolute;left:10px;bottom:60px;z-index:6000;width:min(330px,calc(100% - 20px));max-height:calc(100% - 80px);display:flex;flex-direction:column;gap:10px;padding:12px;
  background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#menu input{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--win)}
#menu .list{display:flex;flex-direction:column;gap:2px;overflow:auto}
#menu .item{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
#menu .item:hover,#menu .item:focus-visible{background:var(--hover)}
#menu .foot{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}

.btn{height:28px;padding:0 10px;border:1px solid var(--line);background:var(--win);border-radius:6px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}

/* Files */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.fbar .path{flex:1;min-width:90px;font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.addrow input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--win)}
.fmain{flex:1;min-height:0;display:flex}
.places{width:128px;flex:none;display:flex;flex-direction:column;gap:2px;padding:8px;border-right:1px solid var(--line);background:var(--win-bar)}
.places button{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:12.5px;cursor:pointer;text-align:left}
.places button:hover{background:var(--hover)}
.flist{flex:1;min-width:0;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:1px}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;height:32px;padding:0 8px;border:0;border-radius:6px;background:none;text-align:left;cursor:default;font-size:13px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sz{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.empty{margin:20px;color:var(--muted);text-align:center}
.fstat{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.fstat.bad,.nstat.bad{color:var(--bad)}
@media (max-width:560px){.places{display:none}}

/* Terminal */
.term{flex:1;min-height:0;overflow:auto;padding:10px 12px;background:var(--term-bg);color:var(--term-fg);font-family:var(--mono);font-size:12.5px;line-height:1.5}
.term .out>div{white-space:pre-wrap;word-break:break-word}
.term .ps{color:#7fd1a8}
.term .d{color:#7ab4ff}
.term .err{color:#ff8f86}
.term .m{color:#8795ab}
.term .in{display:flex;gap:8px}
.term .in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:inherit;padding:0}

/* Notes */
.nbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.nbar input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--win);font-family:var(--mono);font-size:12px}
.body textarea{flex:1;min-height:0;border:0;outline:0;resize:none;padding:12px;background:var(--win);font-family:var(--mono);font-size:13px;line-height:1.55}
.nstat{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* Calculator */
.pyapp{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px}
.pybar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pybar select,.pybar input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--win);color:var(--fg);min-width:0}
.pybar input{flex:1;min-width:90px}
.pycode{flex:1 1 55%;min-height:90px;resize:none;font-family:var(--mono);font-size:13px;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--term-bg);color:var(--term-fg);tab-size:4;white-space:pre;overflow:auto}
.pyout{flex:1 1 35%;min-height:60px;margin:0;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--term-bg);color:var(--term-fg);white-space:pre-wrap;word-break:break-word}
.pyout .e{color:#ff7b72}
.pyapp textarea.pycode,.pyapp pre.pyout{background:#0f141b;color:#d7e2f0}
.pyapp textarea.pycode:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.calc{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px;outline:0}
.cdisp{padding:8px 10px;border-radius:8px;background:var(--win-bar);text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end}
.cdisp small{color:var(--muted);font-size:12px;min-height:16px;font-variant-numeric:tabular-nums}
.cdisp output{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.ckeys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ckeys button{border:1px solid var(--line);border-radius:8px;background:var(--win);font-size:17px;cursor:pointer;min-height:40px}
.ckeys button:hover{background:var(--hover)}
.ckeys .op{background:var(--sel)}
.ckeys .eq{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.ckeys .z{grid-column:span 2}

/* Sketch */
.pgal{padding:10px;overflow:auto;flex:1}.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.pcard{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px}.pcard img{width:100%;border-radius:6px;display:block}.prow{display:flex;flex-wrap:wrap;gap:4px}.prow .btn{padding:3px 8px;font-size:12px}
.ptools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.ptools .sw{display:flex;gap:6px}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.ptools label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.pwrap{flex:1;min-height:0;overflow:auto;padding:10px;background:var(--win-bar)}
.pwrap canvas{display:block;width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:crosshair;touch-action:none}

/* Activity */
.act{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.act table{width:100%;border-collapse:collapse;font-size:13px}
.act th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.act th,.act td{padding:6px 4px;border-bottom:1px solid var(--line)}
.act td:last-child{text-align:right}

/* Settings */
.set{padding:14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.set h3{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.set p{margin:0 0 8px;color:var(--muted);line-height:1.5;max-width:60ch}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.set .sw{display:flex;gap:10px;flex-wrap:wrap}
.set .sw button{width:32px;height:32px}
.set .sw.wall button{width:56px;height:34px;border-radius:8px}

#icons[data-size="s"] .dicon{width:68px;font-size:11px}
#icons[data-size="s"] .dicon .tile{width:34px;height:34px}
#icons[data-size="l"] .dicon{width:104px;font-size:13.5px}
#icons[data-size="l"] .dicon .tile{width:56px;height:56px}
.set>section{flex:none}
.set .wrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set .wprev{width:112px;height:66px;border-radius:8px;border:1px solid var(--line);background-size:cover;background-position:center}
.pfs-tx{flex:1;min-width:0}
.pfset .pf-ta{width:100%;margin-top:6px;box-sizing:border-box}
.set .wmsg{font-size:12.5px;color:var(--muted);margin:6px 0 0}

.glogo{color:var(--accent);display:flex}
.gcard h2{margin:4px 0 0;font-size:22px;letter-spacing:.02em}
.gsub{margin:0 0 8px;color:var(--muted)}

.gcard textarea{min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--win);color:var(--fg);font-family:var(--mono);font-size:11.5px}

.rk{display:inline-block;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;line-height:17px;color:#fff;letter-spacing:.02em;vertical-align:1px;white-space:nowrap}

.mem{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.cmsg{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.mfine{margin:0;font-size:12px;color:var(--muted);line-height:1.5}

.msc[data-n="1"]{color:#2563eb}.msc[data-n="2"]{color:#15803d}.msc[data-n="3"]{color:#dc2626}.msc[data-n="4"]{color:#6d28d9}.msc[data-n="5"],.msc[data-n="6"],.msc[data-n="7"],.msc[data-n="8"]{color:#b45309}

/* Sports */
.sp{display:flex;flex-direction:column;height:100%;min-height:0}

.spsum{font-size:12px;margin-top:2px;color:var(--fg)}
.spmeta{font-size:12px;color:var(--muted)}
.spmeta.live{color:var(--accent)}
.spcard.up{font-size:13px}

.tg-rookie{background:#e6ebf3;color:#46506a}.tg-chill{background:#d8f3ea;color:#116a4c}.tg-gamer{background:#e9defc;color:#5a2bb0}.tg-owl{background:#232a48;color:#c9d2ff}
.tg-sunny{background:#ffe9a8;color:#7a4b00}.tg-frosty{background:#d4efff;color:#0a5b8c}.tg-vip{background:#2b2f3a;color:#ffd35c}

/* Chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.cwrap{flex:1;min-height:0;display:flex;width:100%;box-sizing:border-box;container-type:inline-size;position:relative}
.cwrap>.msgs{flex:1;min-width:0}
.sidetab{position:absolute;top:50%;right:220px;transform:translateY(-50%);z-index:3;writing-mode:vertical-rl;padding:10px 4px;font-size:11px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:var(--win);color:var(--muted);cursor:pointer}
.sidetab:hover,.sidetab:focus-visible{color:var(--fg)}
.cwrap.noside .sidetab{right:0}.cwrap.noside .onlside{display:none}
@container (max-width:600px){.sidetab{display:none}}
.onlside{width:220px;overflow:hidden;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px;min-height:0}
.onlbtn{width:100%}
.ogh.og-owner{color:#f4c542}.ogh.og-coowner{color:#b794f6}.ogh.og-admin{color:#38bdf8}.ogh.og-mod{color:#4ade80}
.ogh{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:10px 4px 2px}
.ogh:first-child{margin-top:2px}
.offtg{width:100%;text-align:left;font-size:12px}
.onlhd{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.onllist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.orow{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--fg);font:inherit;font-size:14px;padding:4px 8px;border-radius:10px;cursor:pointer;text-align:left;width:100%;min-width:0}
.orow:hover,.orow:focus-visible{background:var(--hover,rgba(127,127,127,.15))}
.orow .av{flex:none;position:relative}
.orow .on{width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid var(--win);position:absolute;right:-3px;bottom:-3px;box-sizing:content-box}
.typing{font-size:12px;font-style:italic;color:var(--muted);padding:0 12px 2px}.typing:empty{display:none}
.stbox{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.stbox input,.stbox select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--win);color:var(--fg);width:100%;box-sizing:border-box}
.orow .on.busy{background:#ef4444}
.orow .sn{color:var(--muted);display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.sfrow>span{flex:1;min-width:120px;overflow-wrap:anywhere}.sfrow small{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:13px}
.orow .on.away{background:#f5b82e}
.orow .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.orow small{color:var(--muted);display:block;font-size:11px}
@container (max-width:600px){.onlside{display:none}}
.msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:13.5px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.mrow .msg{max-width:100%}
.av{display:inline-grid;place-items:center;border-radius:50%;background-size:cover;background-position:center;color:#fff;font-weight:600;flex:none;border:0;padding:0;cursor:default}
button.av{cursor:pointer}
.mrow{align-self:flex-end;max-width:92%;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:8px}
.mrow.other{align-self:flex-start;flex-direction:row}
.mcol{min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.mrow.other .mcol{align-items:flex-start}
.pf-body{align-items:center;text-align:center}
.pf-name{font-size:16px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.pf-bio{margin:0;max-width:34ch;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.pf-lb{display:flex;flex-direction:column;gap:4px;width:100%;max-width:340px;text-align:left;font-size:12.5px;color:var(--muted)}
.pf-ta{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--font);font-size:13.5px;line-height:1.4;background:var(--win);color:var(--fg);min-height:64px;resize:vertical}
.mt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chat .hint{margin:auto;text-align:center;color:var(--muted);max-width:32ch;line-height:1.55}
.cin{display:flex;align-items:flex-end;gap:6px;padding:8px;border-top:1px solid var(--line)}
.body .cin textarea{flex:1;min-width:0;min-height:0;height:52px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--font);font-size:13.5px;line-height:1.4;background:var(--win)}
.crow{display:flex;gap:6px}
.gtabs.rtabs{padding:6px 8px 0;flex-wrap:wrap}
.rbadge{display:inline-block;background:var(--accent);color:var(--accent-fg);border-radius:9px;font-size:10px;line-height:16px;min-width:16px;text-align:center;padding:0 4px;margin-left:5px}
.rbadge[hidden]{display:none}
.onl{font-size:11.5px;color:var(--muted);padding:3px 12px 0;min-height:0}
.onl:empty{display:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;vertical-align:middle}
.dmbar{padding:6px 8px 0;display:flex;flex-direction:column;gap:4px}
.dmbar[hidden]{display:none}
.macts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.mrow:hover .macts,.mrow:focus-within .macts{opacity:1}
@media (pointer:coarse){.macts{opacity:.75}}
.mact{border:0;background:transparent;cursor:pointer;font-size:13px;line-height:1;padding:3px 5px;border-radius:6px;color:var(--muted)}
.mact:hover{background:var(--hover)}
.rx{display:flex;flex-wrap:wrap;gap:4px}
.rxb{border:1px solid var(--line);background:var(--win);border-radius:12px;padding:1px 8px;font-size:12px;cursor:pointer;color:var(--fg)}
.rxb[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.rxpick{display:flex;flex-wrap:wrap;gap:4px;padding:3px 5px;border:1px solid var(--line);border-radius:12px;background:var(--win)}
.qt{border-left:3px solid currentColor;opacity:.8;padding:0 8px;margin-bottom:5px;font-size:12px}
.rpbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.rpbar[hidden]{display:none}
.rptx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfoot{flex-wrap:wrap}
.crow{flex-wrap:wrap}

.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 8px}
.cnote{font-size:11.5px;color:var(--muted)}

/* Calendar */
.cal{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.chead{display:flex;align-items:center;gap:6px;padding:8px}
.chead b{flex:1;text-align:center;font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:0 8px}
.cgrid .wd{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.cgrid .d{height:44px;border:1px solid transparent;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-variant-numeric:tabular-nums}
.cgrid .d:hover{background:var(--hover)}
.cgrid .d.sel{background:var(--sel);border-color:var(--accent)}
.cgrid .d span{width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cgrid .d.today span{background:var(--accent);color:var(--accent-fg)}
.cgrid .d i{display:flex;gap:2px;height:5px}
.cgrid .d em{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cday{margin-top:8px;padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cday h4{margin:0;font-size:13px}
.cday ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.cday li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.cday li.none{border:0;padding:0;color:var(--muted)}
.cday .tm{min-width:64px;color:var(--muted);font-variant-numeric:tabular-nums}
.cday .ttl{flex:1;min-width:0;overflow-wrap:anywhere}
.cadd{display:flex;flex-wrap:wrap;gap:6px}
.cadd input{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--win)}
.cadd .tt{flex:1;min-width:120px}

/* Weather */
.wx{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding-bottom:12px}
.wnow{margin:12px;padding:18px 20px 14px;border-radius:16px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.22);
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;
  background:linear-gradient(135deg,#5b7fb0,#8da8cf);box-shadow:0 6px 18px rgba(20,30,60,.22)}
.wnow[data-k="sun"]{background:linear-gradient(135deg,#f6a93b,#ee6a4c)}
.wnow[data-k="night"]{background:linear-gradient(135deg,#141b3a,#3b4283)}
.wnow[data-k="partly"]{background:linear-gradient(135deg,#4f9fe0,#e9ad5a)}
.wnow[data-k="cloud"]{background:linear-gradient(135deg,#67788d,#9aa8ba)}
.wnow[data-k="rain"]{background:linear-gradient(135deg,#2f4c69,#587f9f)}
.wnow[data-k=""]{background:var(--win-bar);color:var(--muted);text-shadow:none;box-shadow:none;border:1px dashed var(--line);grid-template-columns:auto minmax(0,1fr);padding:18px}
.wl{display:flex;flex-direction:column;min-width:0}
.wplace{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbig{font-size:64px;font-weight:500;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wdesc{font-size:16px;font-weight:500}
.whl{font-size:13px;opacity:.92;margin-top:2px;font-variant-numeric:tabular-nums}
.wico{display:grid;place-items:center;flex:none}
.wico.hero{color:#fff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.wico.empty{color:var(--muted)}
.wfoot{grid-column:1 / -1;font-size:12px;opacity:.9}
.wempty{margin:0;line-height:1.5}
.wnote{margin:0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--win-bar);font-size:12.5px;color:var(--muted);line-height:1.45}
.wlabel{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.whead{margin:12px 16px 6px}
.wdays{list-style:none;margin:0 12px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--win);overflow:hidden}
.wdays li{display:grid;grid-template-columns:minmax(64px,92px) 24px 34px 30px minmax(30px,1fr) 30px;align-items:center;gap:8px;padding:9px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.wdays li+li{border-top:1px solid var(--line)}
.wdays .wico{color:var(--accent)}
.wdays .dn{font-weight:500}
.wdays .dp{color:var(--accent);font-size:12px}
.wdays .dl{color:var(--muted);text-align:right}
.wdays .dh{text-align:right;font-weight:600}
.dbar{position:relative;height:6px;border-radius:3px;background:var(--win-bar)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#4f9fe0,#f0a84a)}
.wsearch{display:flex;gap:6px;padding:12px 12px 0}
.wsearch input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--win)}
.wsearch .btn{height:32px}
.wres{margin:8px 12px 0;border:1px solid var(--line);border-radius:10px;background:var(--win);overflow:hidden}
.wopt{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;cursor:pointer;font-size:13px}
.wopt+.wopt{border-top:1px solid var(--line)}
.wopt:hover,.wopt:focus-visible{background:var(--hover)}
.wmsg{margin:8px 12px 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.wmsg.bad{color:var(--bad)}
.wnow[data-k="snow"]{background:linear-gradient(135deg,#5f88b4,#a9c3de)}
.wnow[data-k="fog"]{background:linear-gradient(135deg,#6c7886,#9ca7b4)}
.wnow[data-k="storm"]{background:linear-gradient(135deg,#262a40,#5a4b86)}

.wfine{margin:10px 16px 0;font-size:11.5px;color:var(--muted);line-height:1.45}

/* Games */

.jtop{display:flex;gap:6px;padding:8px}.jsrch{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--win);color:var(--fg);font:inherit}

  for(const s of parts){if(!s||s==='.')continue;if(s==='..')o.pop();else o.push(s)}

};

  const par=get(parts.slice(0,-1)),nm=parts[parts.length-1];
  if(!par||par.t!=='d')return 'No such directory';
  if(!nm)return 'Invalid name';
  if(nm in par.c)return `"${nm}" already exists`;
  par.c[nm]=type==='d'?{t:'d',c:{}}:{t:'f',c:content};changed();return null;
};
const rmNode=parts=>{

  const par=get(parts.slice(0,-1)),nm=parts[parts.length-1];
  if(!par||!(nm in par.c))return 'No such file or directory';
  delete par.c[nm];changed();return null;
};

  const title=()=>w.setTitle((dirty?'• ':'')+(norm(inp.value).pop()||'untitled'));
  const msg=(t,bad)=>{st.className='nstat'+(bad?' bad':'');st.textContent=t};

/* Calculator */
function mountCalc(w,b){
  let cur='0',prev=null,op=null,fresh=true,expr='';
  b.innerHTML=`<div class="calc" tabindex="0" aria-label="Calculator"><div class="cdisp"><small></small><output aria-live="polite">0</output></div><div class="ckeys"></div></div>`;
  const root=$('.calc',b),small=$('small',b),outp=$('output',b),keys=$('.ckeys',b);
  const fmt=n=>isFinite(n)?String(parseFloat(n.toPrecision(12))):'Error';
  const calc=(a,c,o)=>o==='+'?a+c:o==='−'?a-c:o==='×'?a*c:c===0?NaN:a/c;
  const show=()=>{outp.textContent=cur;small.textContent=expr};
  function press(k){
    if(/^\d$/.test(k)){if(fresh){cur=k;fresh=false}else if(cur.length<14)cur=cur==='0'?k:cur+k}
    else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
    else if(k==='AC'){cur='0';prev=null;op=null;fresh=true;expr=''}
    else if(k==='±'){if(cur!=='0'&&cur!=='Error')cur=cur.startsWith('-')?cur.slice(1):'-'+cur}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100);fresh=true}
    else if(k==='='){if(op!==null){const r=calc(prev,parseFloat(cur),op);expr=`${fmt(prev)} ${op} ${cur} =`;cur=fmt(r);prev=null;op=null;fresh=true}}
    else{
      if(op!==null&&!fresh){const r=calc(prev,parseFloat(cur),op);prev=r;cur=fmt(r)}else prev=parseFloat(cur);
      op=k;fresh=true;expr=`${fmt(prev)} ${op}`;
    }
    show();
  }
  const layout=['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  for(const k of layout){
    const x=el('button',(/[÷×−+]/.test(k)?'op ':'')+(k==='='?'eq ':'')+(k==='0'?'z':''),k);x.type='button';
    x.onclick=()=>press(k);keys.append(x);
  }
  const map={'/':'÷','*':'×','-':'−','+':'+','Enter':'=','=':'=','Escape':'AC','%':'%','.':'.'};
  root.addEventListener('keydown',e=>{
    if(/^\d$/.test(e.key))press(e.key);else if(map[e.key]){e.preventDefault();press(map[e.key])}
    else if(e.key==='Backspace'&&!fresh){cur=cur.length>1?cur.slice(0,-1):'0';show()}
  });
  show();
}

        const nm0=rec(k).name;dirDel(k);delete accts[k];saveAccts();if(DIR[k])DIR[k].removed=true;logAct(actor()+' removed '+nm0);
        try{for(const x of Object.keys(localStorage))if(x.startsWith('halcyon.u.'+k+'.'))localStorage.removeItem(x)}catch(e){}
        bus.dispatchEvent(new Event('dir'));print('Removed '+nm0+'.');break;
      }
      case 'clearlog':{
        if(rankIdx(uid)<3)return E('clearlog: Co-owners and above only');
        try{localStorage.setItem(MLOG,'[]')}catch(e){}logAct(actor()+' cleared the staff log');print('Staff log cleared.');break;
      }
      case 'unbanall':{
        if(rankIdx(uid)<3)return E('unbanall: Co-owners and above only');
        let n=0;for(const k of accKeys()){const a=rec(k);if(a.banned&&rankIdx(k)<rankIdx(uid)){delete a.banned;if(accts[k])saveAccts();dirPut(k);n++}}
        if(n)logAct(actor()+' lifted '+n+' ban'+(n===1?'':'s'));bus.dispatchEvent(new Event('dir'));print('Lifted '+n+' ban'+(n===1?'':'s')+'.');break;
      }
      case 'crateoff':case 'crateon':{
        if(rankIdx(uid)<4)return E(cmd+': only the Owner can use this command');
        const f=(args[0]||'').toLowerCase();if(!own(FX,f))return E('usage: '+cmd+' <'+Object.keys(FX).join('|')+'>');
        const off=new Set(CRATE_OFF);if(cmd==='crateoff')off.add(f);else off.delete(f);setCrateOff([...off]);print(FX[f].n+' crate is now '+(cmd==='crateoff'?'closed':'open')+'.');break;
      }
      case 'coins':{
        if(rankIdx(uid)<4)return E('coins: only the Owner can use this command');
        const n=parseInt(args[0],10);if(!(n>=1))return E('usage: coins <amount>');
        const c=coinGet();c.n=Math.min(1e6,c.n+n);coinSave(c);print('You now have '+c.n+' coins.');break;
      }
      case 'crates':{
        if(rankIdx(uid)<4)return E('crates: only the Owner can use this command');
        print('Crates you can open with "crate <name> [count]":\n'+CRATES.map(c=>'  '+c.id.padEnd(10)+c.n).join('\n')+'\n  all       one of every crate each time');
        break;
      }
      case 'crate':{
        if(rankIdx(uid)<4)return E('crate: only the Owner can use this command');
        const id=(args[0]||'').toLowerCase();
        let n=args[1]===undefined?1:parseInt(args[1],10);
        if(!id||!(n>=1))return E('usage: crate <name|all> [count]   (type "crates" for the names)');
        const list=id==='all'?CRATES:CRATES.filter(c=>c.id===id);
        if(!list.length)return E('crate: unknown crate "'+args[0]+'". Type "crates" for the list.');
        const cap=Math.floor(500/list.length);if(n>cap){n=cap;print('Opening '+(n*list.length)+' crates (500 at a time is the most).','m')}
        const s=crateState();let fresh=0,dup=0;const got=[];
        for(let i=0;i<n;i++)for(const c of list){
          const r=rollItem(c),k=r.c+':'+r.k;
          if(s.inv[k])dup++;else{s.inv[k]=1;fresh++;const it=itemInfo(r.c,r.k);got.push((it.f?it.f+': ':'')+it.n+' ('+RAR[it.r]+')')}
        }
        saveCrates(s);bus.dispatchEvent(new Event('crates'));
        const tot=n*list.length;
        print('Opened '+tot+' crate'+(tot===1?'':'s')+': '+fresh+' new, '+dup+' duplicate'+(dup===1?'':'s')+'.'+(got.length?'\nNew: '+got.join(', '):''));
        break;
      }
    default:return false;
  }
  return true;
}

/* Games: Snake, Tic-Tac-Toe, Memory */
function mountGames(w,b){
  b.innerHTML=`<div class="gm"><div class="gtabs" role="tablist"></div><div class="gbody"></div></div>`;
  const tabs=$('.gtabs',b),body=$('.gbody',b);
  let stop=null;
  const GAMES=[['snake','Snake',snake],['ttt','Tic-Tac-Toe',ttt],['mem','Memory',memory],['mine','Minesweeper',mines],['chess','Chess',chess],['casino','Casino',casino],['puzzle','Puzzles',chessPuzzle],['check','Checkers',checkers],['hockey','Air Hockey',hockey],['c4','Connect 4',connect4],['g2048','2048',g2048],['sudoku','Sudoku',sudoku],['pong','Pong',pong],['typing','Typing',typing],['scores','Scores',scores]];
  const best=k=>{try{return +ls.getItem('halcyon.best.'+k)||0}catch(e){return 0}};
  const setBest=(k,v)=>{try{ls.setItem('halcyon.best.'+k,String(v))}catch(e){}};
  function open(id){
    if(stop){stop();stop=null}
    body.innerHTML='';
    $$('.gtabs button').forEach(x=>{if(b.contains(x))x.setAttribute('aria-selected',x.dataset.id===id)});
    const g=GAMES.find(x=>x[0]===id);stop=g[2](body)||null;
  }
  for(const [id,name] of GAMES){
    const x=el('button','gtab',name);x.type='button';x.dataset.id=id;x.setAttribute('role','tab');x.onclick=()=>open(id);tabs.append(x);
  }
  w.cleanup.push(()=>{if(stop)stop()});

  function snake(root){
    const N=18,C=20;
    root.innerHTML=`<div class="gcol"><div class="gscore"><span>Score <b class="sc">0</b></span><span>Best <b class="bs">${best('snake')}</b></span></div><div class="sw" tabindex="0" aria-label="Snake board. Use the arrow keys."><canvas width="${N*C}" height="${N*C}"></canvas><div class="sov"><b>Snake</b><span>Press an arrow key or Start</span></div></div><div class="gpad"><span></span><button type="button" data-d="u" aria-label="Up">▲</button><span></span><button type="button" data-d="l" aria-label="Left">◀</button><button type="button" data-d="s" class="go">Start</button><button type="button" data-d="r" aria-label="Right">▶</button><span></span><button type="button" data-d="d" aria-label="Down">▼</button><span></span></div></div>`;
    const cv=$('canvas',root),g=cv.getContext('2d'),ov=$('.sov',root),wrap=$('.sw',root),sc=$('.sc',root),bs=$('.bs',root),goBtn=$('.go',root);
    let s,dir,next,food,score,timer=null,over=false;
    const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
    const cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#2f6df6';
    function reset(){s=[[9,9],[8,9],[7,9]];dir=V.r;next=V.r;score=0;over=false;sc.textContent=0;place();draw()}
    function place(){do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(s.some(p=>p[0]===food[0]&&p[1]===food[1]))}
    function draw(){
      g.fillStyle='#10151d';g.fillRect(0,0,N*C,N*C);
      g.fillStyle='rgba(255,255,255,.04)';
      for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)g.fillRect(i*C,j*C,C,C);
      g.fillStyle='#ef6a5b';g.beginPath();g.arc(food[0]*C+C/2,food[1]*C+C/2,C*.36,0,7);g.fill();
      s.forEach((p,i)=>{g.fillStyle=i?cs('--accent'):'#ffffff';g.globalAlpha=i?Math.max(.45,1-i*.03):1;g.fillRect(p[0]*C+1,p[1]*C+1,C-2,C-2)});
      g.globalAlpha=1;
    }
    function step(){
      dir=next;const h=[s[0][0]+dir[0],s[0][1]+dir[1]];
      if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(p=>p[0]===h[0]&&p[1]===h[1]))return end();
      s.unshift(h);
      if(h[0]===food[0]&&h[1]===food[1]){score++;sc.textContent=score;place()}else s.pop();
      draw();
    }
    function start(){
      if(timer)return;if(over||!s)reset();
      ov.hidden=true;goBtn.textContent='Pause';
      timer=setInterval(step,120);
    }
    function pause(){if(timer){clearInterval(timer);timer=null}goBtn.textContent='Start'}
    function end(){
      pause();over=true;ov.hidden=false;
      if(score>best('snake')){setBest('snake',score);bs.textContent=score}
      if(score>=2)coinAdd(Math.floor(score/2));
      ov.innerHTML=`<b>Game over</b><span>Score ${score}. Press an arrow key or Start to play again.</span>`;
    }
    function turn(k){
      const d=V[k];if(!d)return;
      if(over)reset();
      if(d[0]!==-dir[0]||d[1]!==-dir[1])next=d;

  }

  function pong(root){
    const W=360,H=240,PH=52,PW=8,BR=7,WIN=5;
    root.innerHTML=`<div class="gcol"><div class="gscore"><span>You <b class="py">0</b></span><span>Computer <b class="pc">0</b></span><span>First to ${WIN}</span></div><div class="sw"><canvas width="${W}" height="${H}" tabindex="0" aria-label="Pong. Move the pointer or use the up and down arrow keys."></canvas><div class="sov"><b>Pong</b><span>Move your mouse or finger up and down, or use the arrow keys.</span><button type="button" class="btn pri" data-k="go">Start</button></div></div><div class="arow"><select class="btn" data-k="lvl" aria-label="Difficulty"><option value="2.4">Easy</option><option value="3.4" selected>Normal</option><option value="4.6">Hard</option></select></div></div>`;
    const cv=$('canvas',root),ctx=cv.getContext('2d'),ov=$('.sov',root),py=$('.py',root),pc=$('.pc',root),lvl=$('[data-k=lvl]',root);
    const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
    let me,ai,ball,sc,ty,run=false,raf=0,lt=0,hold=0;const keys={};
    function serve(dir){ball={x:W/2,y:H/2,vx:3.2*dir,vy:(Math.random()*2-1)*2};hold=performance.now()+600}
    function newGame(){sc=[0,0];py.textContent=0;pc.textContent=0;me=H/2;ai=H/2;ty=H/2;serve(1)}
    function score(who){
      sc[who]++;py.textContent=sc[0];pc.textContent=sc[1];
      if(sc[who]>=WIN){run=false;const won=who===0;if(won){coinAdd(6);statWin('pong')}else statLoss();
        ov.innerHTML=`<b>${won?'You win!':'Computer wins'}</b><span>${sc[0]} – ${sc[1]}${won?' · +6 coins':''}</span><button type="button" class="btn pri" data-k="go">Play again</button>`;ov.hidden=false;bind()}
      else serve(who===0?-1:1);
    }
    function step(dt){
      if(keys.ArrowUp)ty-=6*dt;if(keys.ArrowDown)ty+=6*dt;ty=cl(ty,PH/2,H-PH/2);
      me+=cl(ty-me,-9*dt,9*dt);
      const sp=+lvl.value;ai+=cl(ball.y-ai,-sp*dt,sp*dt);ai=cl(ai,PH/2,H-PH/2);
      if(performance.now()<hold)return;
      ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.y<BR){ball.y=BR;ball.vy=Math.abs(ball.vy)}else if(ball.y>H-BR){ball.y=H-BR;ball.vy=-Math.abs(ball.vy)}
      const bounce=(px,py2,dir)=>{
        if(Math.abs(ball.y-py2)<PH/2+BR&&((dir>0&&ball.x-BR<px+PW&&ball.x>px)||(dir<0&&ball.x+BR>px&&ball.x<px+PW))&&Math.sign(ball.vx)===-dir){
          const off=(ball.y-py2)/(PH/2),s=Math.min(11,Math.hypot(ball.vx,ball.vy)*1.06+0.15);
          ball.vx=dir*s*0.85;ball.vy=off*s*0.7;ball.x=dir>0?px+PW+BR:px-BR;
        }
      };
      bounce(14,me,1);bounce(W-14-PW,ai,-1);
      if(ball.x<-BR)score(1);else if(ball.x>W+BR)score(0);
    }
    function draw(){
      ctx.fillStyle='#10324f';ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([8,8]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#3a8dff';ctx.fillRect(14,me-PH/2,PW,PH);ctx.fillStyle='#e0524c';ctx.fillRect(W-14-PW,ai-PH/2,PW,PH);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,7);ctx.fill();
    }
    function loop(t){if(!run)return;const dt=Math.min(2,(t-(lt||t))/16.67||1);lt=t;step(dt);draw();raf=requestAnimationFrame(loop)}
    function start(){if(sc[0]>=WIN||sc[1]>=WIN)newGame();ov.hidden=true;run=true;lt=0;cv.focus({preventScroll:true});cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
    function bind(){$('[data-k=go]',ov).onclick=start}
    function pt(e){const r=cv.getBoundingClientRect();ty=(e.clientY-r.top)*H/r.height}
    cv.addEventListener('pointermove',pt);cv.addEventListener('pointerdown',pt);
    cv.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){keys[e.key]=1;e.preventDefault()}});
    cv.addEventListener('keyup',e=>{delete keys[e.key]});
    newGame();draw();bind();
    return()=>{run=false;cancelAnimationFrame(raf)};
  }

/* Music: tracks are made on the spot with Web Audio, so there are no song files */
function mountMusic(w,b){
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  let ctx=null,an=null,bus=null,pbus=null,nbuf=null;
  let vol=0.7,cur=0,playing=false,timer=null,nextT=0,stepN=0,raf=0,view='play';
  const ui={};
  const au=new Audio();au.preload='metadata';
  b.innerHTML=`<div class="gm"><div class="gtabs" role="tablist"></div><div class="mus"></div></div>`;
  const tabs=$('.gtabs',b),root=$('.mus',b);

  /* audio engine */
  function ensure(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC();an=ctx.createAnalyser();an.fftSize=128;an.smoothingTimeConstant=.8;an.connect(ctx.destination)}catch(e){ctx=null;return false}
    return true;
  }
  function makeBus(){
    const m=ctx.createGain();m.gain.value=vol;
    const fx=ctx.createGain(),d=ctx.createDelay(1.5),fb=ctx.createGain(),wet=ctx.createGain();
    d.delayTime.value=.38;fb.gain.value=.35;wet.gain.value=.28;
    fx.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(m);m.connect(an);
    return {m,fx};
  }
  function killBus(x){if(!x)return;try{x.m.gain.setTargetAtTime(0,ctx.currentTime,.05)}catch(e){}setTimeout(()=>{try{x.m.disconnect()}catch(e){}},700)}
  function tone(f,t,dur,o){
    o=o||{};const B=o.bus||bus;if(!B)return;
    const osc=ctx.createOscillator(),g=ctx.createGain(),fl=ctx.createBiquadFilter();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
    fl.type='lowpass';fl.frequency.value=o.cut||4000;
    const a=o.att||.01,r=o.rel||.1,v=o.vol||.2,h=Math.max(a,dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+h);g.gain.linearRampToValueAtTime(.0001,t+h+r);
    osc.connect(fl);fl.connect(g);g.connect(B.m);
    if(o.echo){const s=ctx.createGain();s.gain.value=o.echo;g.connect(s);s.connect(B.fx)}
    osc.start(t);osc.stop(t+h+r+.05);
  }
  function noise(){
    if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    return nbuf;
  }
  function hit(t,dur,hp,v){
    if(!bus)return;
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    s.buffer=noise();f.type='highpass';f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(bus.m);s.start(t);s.stop(t+dur+.02);
  }
  function kick(t,v){
    if(!bus)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
    o.connect(g);g.connect(bus.m);o.start(t);o.stop(t+.3);
  }

  /* tracks: fn(step, time, secondsPerSixteenth) is called for every 16th note */
  const CH=[[45,57,60,64,71],[41,57,60,65,69],[48,55,59,64,67],[43,55,59,62,64]];
  const PENT=[76,79,81,83,86,88];
  const LC=[[50,53,57,60],[43,53,55,59],[48,52,55,59],[45,52,55,60]],LR=[38,43,36,45];
  const NR=[45,41,48,43],NC=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  const MB=[60,62,64,67,69,72,74,76,79,81],MR=[48,45,41,43];
  let mbPos=4;
  const TRACKS=[
    {name:'Slow Tide',mood:'Ambient pads',bpm:60,fn(i,t,s){
      if(i%32===0)CH[Math.floor(i/32)%4].forEach((m,k)=>tone(mtof(m),t,s*30,{type:k?'triangle':'sine',att:2.2,rel:3,vol:k?.05:.09,cut:900,echo:.5}));
      if(i%4===0&&Math.random()<.3)tone(mtof(PENT[Math.floor(Math.random()*PENT.length)]),t,.01,{att:.005,rel:2.4,vol:.07,echo:.8});
    }},
    {name:'Lo-fi Loop',mood:'Chill beat',bpm:78,fn(i,t,s){
      const bar=Math.floor(i/16)%4,p=i%16,c=LC[bar];
      if(p===0||p===10)kick(t,.6);

/* Timer: countdown and stopwatch */
function mountTimer(w,b){
  b.innerHTML=`<div class="gm"><div class="gtabs" role="tablist"></div><div class="tmr"></div></div>`;
  const tabs=$('.gtabs',b),root=$('.tmr',b);
  let iv=null,ctx=null;
  const pad=n=>String(n).padStart(2,'0');
  const fmt=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600);return (h?h+':':'')+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
  const stop=()=>{clearInterval(iv);iv=null};
  function beep(){
    try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();if(ctx.state==='suspended')ctx.resume();
      for(let i=0;i<3;i++){const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.35;o.frequency.value=880;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.27)}}catch(e){}
  }
  function countdown(){
    root.innerHTML=`<div class="tbig" aria-live="off">05:00</div><div class="tin"><label>Min<input type="number" min="0" max="999" value="5" data-k="m" inputmode="numeric"></label><label>Sec<input type="number" min="0" max="59" value="0" data-k="s" inputmode="numeric"></label></div><div class="arow"><button type="button" class="btn pri" data-k="go">Start</button><button type="button" class="btn" data-k="rs">Reset</button></div><p class="gmsg" aria-live="polite"></p>`;
    const big=$('.tbig',root),mi=$('[data-k=m]',root),se=$('[data-k=s]',root),go=$('[data-k=go]',root),msg=$('.gmsg',root);
    let left=0,end=0,run=false;
    const read=()=>Math.max(0,Math.min(999,Math.floor(+mi.value||0)))*60+Math.max(0,Math.min(59,Math.floor(+se.value||0)));
    const show=()=>{big.textContent=fmt(run?left:read()*1000)};
    function tick(){left=Math.max(0,end-Date.now());show();if(left<=0){stop();run=false;go.textContent='Start';mi.disabled=se.disabled=false;msg.textContent="Time's up!";beep()}}
    go.onclick=()=>{
      if(run){stop();run=false;left=end-Date.now();go.textContent='Resume';return}
      if(!left){left=read()*1000;if(!left)return}
      end=Date.now()+left;run=true;mi.disabled=se.disabled=true;msg.textContent='';go.textContent='Pause';stop();iv=setInterval(tick,200);tick();
    };
    $('[data-k=rs]',root).onclick=()=>{stop();run=false;left=0;go.textContent='Start';mi.disabled=se.disabled=false;msg.textContent='';show()};
    mi.oninput=se.oninput=()=>{if(!run&&!left)show()};
    show();
  }
  function stopwatch(){
    root.innerHTML=`<div class="tbig">00:00.0</div><div class="arow"><button type="button" class="btn pri" data-k="go">Start</button><button type="button" class="btn" data-k="lap" disabled>Lap</button><button type="button" class="btn" data-k="rs">Reset</button></div><ol class="lapl" aria-label="Laps"></ol>`;
    const big=$('.tbig',root),go=$('[data-k=go]',root),lap=$('[data-k=lap]',root),ol=$('.lapl',root);
    let acc=0,st=0,run=false,laps=[];
    const now=()=>acc+(run?Date.now()-st:0);
    const f=ms=>pad(Math.floor(ms/60000))+':'+pad(Math.floor(ms/1000)%60)+'.'+Math.floor(ms/100)%10;
    const show=()=>{big.textContent=f(now())};
    go.onclick=()=>{
      if(run){acc+=Date.now()-st;run=false;stop();go.textContent='Resume';lap.disabled=true;show();return}
      st=Date.now();run=true;go.textContent='Pause';lap.disabled=false;stop();iv=setInterval(show,100);
    };
    lap.onclick=()=>{laps.push(now());ol.innerHTML='';laps.forEach((t,i)=>{const li=el('li');li.append(el('span','','Lap '+(i+1)),el('span','',f(t-(laps[i-1]||0))+'  ('+f(t)+')'));ol.prepend(li)})};
    $('[data-k=rs]',root).onclick=()=>{stop();run=false;acc=0;laps=[];ol.innerHTML='';go.textContent='Start';lap.disabled=true;show()};
  }
  function focus(){
    root.innerHTML=`<div class="tbig">25:00</div><p class="gmsg" data-k="ph" aria-live="polite">Focus time</p><div class="arow"><button type="button" class="btn pri" data-k="go">Start</button><button type="button" class="btn" data-k="skip">Skip</button><button type="button" class="btn" data-k="rs">Reset</button></div><div class="arow"><label class="mfine">Focus <select class="btn" data-k="fl"><option>15</option><option selected>25</option><option>50</option></select> min</label><label class="mfine">Break <select class="btn" data-k="bl"><option>5</option><option>10</option><option>15</option></select> min</label></div><p class="mfine" data-k="cnt"></p>`;
    const big=$('.tbig',root),ph=$('[data-k=ph]',root),go=$('[data-k=go]',root),fl=$('[data-k=fl]',root),bl=$('[data-k=bl]',root),cnt=$('[data-k=cnt]',root);
    let phase='f',left=+fl.value*60000,end=0,run=false;
    const dayN=()=>{try{const x=JSON.parse(ls.getItem('halcyon.focus')||'{}');return x.day===todayStr()?+x.n||0:0}catch(e){return 0}};
    const setN=n=>{try{ls.setItem('halcyon.focus',JSON.stringify({day:todayStr(),n}))}catch(e){}};
    const dur=()=>(phase==='f'?+fl.value:+bl.value)*60000;
    const show=()=>{big.textContent=fmt(run?left:left);ph.textContent=phase==='f'?'Focus time':'Break time';cnt.textContent='Focus sessions today: '+dayN()+'. Each finished session earns 3 coins.'};
    function tick(){left=Math.max(0,end-Date.now());show();if(left<=0){
      stop();run=false;beep();
      if(phase==='f'){const n=dayN()+1;setN(n);coinAdd(3);incStat('f');phase='b'}else phase='f';
      left=dur();go.textContent=phase==='f'?'Start focus':'Start break';show()}}
    go.onclick=()=>{if(run){stop();run=false;left=Math.max(0,end-Date.now());go.textContent='Resume';show();return}
      if(!left)left=dur();end=Date.now()+left;run=true;go.textContent='Pause';stop();iv=setInterval(tick,250);tick()};
    $('[data-k=skip]',root).onclick=()=>{stop();run=false;phase=phase==='f'?'b':'f';left=dur();go.textContent=phase==='f'?'Start focus':'Start break';show()};
    $('[data-k=rs]',root).onclick=()=>{stop();run=false;phase='f';left=dur();go.textContent='Start';show()};
    fl.onchange=bl.onchange=()=>{if(!run){left=dur();show()}};
    show();
  }
  function open(id){
    stop();$$('.gtabs button').forEach(x=>{if(b.contains(x))x.setAttribute('aria-selected',x.dataset.id===id)});
    id==='cd'?countdown():id==='fc'?focus():stopwatch();
  }
  [['cd','Timer'],['sw','Stopwatch'],['fc','Focus']].forEach(t=>{const x=el('button','gtab',t[1]);x.type='button';x.dataset.id=t[0];x.setAttribute('role','tab');x.onclick=()=>open(t[0]);tabs.append(x)});
  w.cleanup.push(()=>{stop();if(ctx)try{ctx.close()}catch(e){}});
  open('cd');
}

  }

    cur.t=ti.value;cur.b=bo.value;cur.at=Date.now();

  }

let remSeen=null;
function remindCheck(){
  if(!uid||!prefs||prefs.remind===false)return;
  if(!remEl.isConnected){const sc=$('#screen');if(!sc)return;sc.append(remEl)}
  if(!remSeen){remSeen=new Set();try{const a=JSON.parse(ls.getItem('halcyon.remn')||'[]');if(Array.isArray(a))a.forEach(x=>typeof x==='string'&&remSeen.add(x))}catch(e){}}

  for(const e of ev){

    const x=el('button','btn','Dismiss');x.type='button';x.onclick=()=>c.remove();

        if(pend){
          logAct('New account '+name+' is waiting for approval');
          gate.innerHTML=`<div class="gcard"><div class="glogo">${ic('logo',32)}</div><h2 id="gt"></h2><p class="gsub">Account created.</p><p class="gfine" style="margin:0 0 8px">A Co-owner or the Owner needs to approve it before you can enter.</p><button type="button" class="btn pri gbtn">Back to sign in</button></div>`;
          $('#gt',gate).textContent=sys.osName;$('.gbtn',gate).onclick=()=>showGate('login');return;
        }
        boot(key);
      }else{
        const useFb=FBCFG&&!hasClaude();
        if(useFb)await fbLoad();
        let a=Object.prototype.hasOwnProperty.call(accts,key)?accts[key]:null;
        let ok=a&&(await derive(pw,unb64(a.salt),a.iter))===a.hash;
        if(!a&&useFb&&fbAuth){
          /* no account on this device: sign in online and bring the account here */
          let good=false;try{await fbAuth.signInWithEmailAndPassword(fbEmail(key),pw);good=true}catch(x){}
          if(good){
            let x=null;try{const sn=await fbStore.collection('members').doc(key).get();if(sn.exists)x=sn.data()}catch(y){}
            if(x&&x.removed){await fbAuth.signOut().catch(()=>{});err.textContent='This account was removed.';p.value='';return}
            if(x&&x.banned){await fbAuth.signOut().catch(()=>{});err.textContent='This account has been banned.';p.value='';return}
            const salt=crypto.getRandomValues(new Uint8Array(16)),iter=150000;
            accts[key]={name:x&&typeof x.name==='string'?x.name:name,rank:x&&RANKS.some(r=>r[0]===x.rank)?x.rank:'member',salt:b64(salt),iter,hash:await derive(pw,salt,iter)};
            try{localStorage.setItem(ACCT,JSON.stringify(accts))}catch(y){delete accts[key];err.textContent='Could not save the account. Browser storage seems to be blocked.';return}
            fails=0;boot(key);return;
          }
        }
        if(!ok){
          fails++;err.textContent='Wrong username or password.';p.value='';p.focus();
          await new Promise(r=>setTimeout(r,Math.min(5000,fails*600)));
          return;
        }
        if(accts[key].banned){err.textContent='This account has been banned.';p.value='';return}
        if(accts[key].pending){err.textContent='Your account is waiting for approval from a Co-owner or the Owner.';p.value='';return}
        if(useFb&&fbAuth)await fbSignIn(key,pw);
        fails=0;boot(key);
      }
    }catch(x){err.textContent='Something went wrong. Try again.'}
    finally{if(btn.isConnected)btn.disabled=false}
  });
}

applyPrefs(true);applyName();dirInit();
let sess=null;
try{sess=sessionStorage.getItem(SESS)}catch(e){}
addEventListener('storage',e=>{
  if(e.key===SYS){loadSys();applyName();showAnn();return}
  if(e.key!==ACCT)return;
  try{const a=JSON.parse(e.newValue||'{}');if(a&&typeof a==='object'&&!Array.isArray(a))accts=a}catch(x){return}
  if(uid&&(!accts[uid]||accts[uid].banned))signOut();
});
if(sess&&Object.prototype.hasOwnProperty.call(accts,sess)&&!accts[sess].banned&&!accts[sess].pending)boot(sess);else showGate('login');
})();
</script>
