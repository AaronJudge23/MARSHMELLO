<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MARSHMELLO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one framed "screen" inside the page. Desktop surface with icons and floating windows, taskbar along the bottom, start menu above it. */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --page:#c9d1dc; --panel:rgba(248,250,253,.82); --panel-solid:#f6f8fb; --win:#fbfcfd; --win-bar:#eaeef4;
  --fg:#18202e; --muted:#5a6578; --line:#d5dbe5; --hover:rgba(24,32,46,.07); --sel:rgba(47,109,246,.14);
  --accent:#2f6df6; --accent-fg:#ffffff; --term-bg:#0f141c; --term-fg:#d6dfec; --bad:#d6453d; --ok:#1f9d63;
  --r-owner:#a8650d; --r-coowner:#c2410c; --r-admin:#b42318; --r-mod:#16794a; --r-member:#5a6578;
  --shadow:0 18px 44px rgba(10,18,36,.32),0 2px 6px rgba(10,18,36,.18);
  --wall-tide:radial-gradient(120% 90% at 85% 10%,rgba(160,215,200,.55),transparent 60%),linear-gradient(135deg,#1c3556 0%,#2c6486 50%,#5fa595 100%);
  --wall-dusk:radial-gradient(110% 90% at 15% 0%,rgba(240,170,110,.5),transparent 60%),linear-gradient(140deg,#281f4b 0%,#7a3a69 55%,#d98a58 100%);
  --wall-moss:radial-gradient(100% 80% at 90% 0%,rgba(190,205,150,.4),transparent 60%),linear-gradient(135deg,#17241e 0%,#35523f 55%,#8da57a 100%);
  --wall-slate:linear-gradient(135deg,#1c2028 0%,#38414f 55%,#69758a 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#080b11; --panel:rgba(21,26,35,.82); --panel-solid:#171c26; --win:#1a202b; --win-bar:#232a38;
  --fg:#e5eaf2; --muted:#93a0b4; --line:#2d3545; --hover:rgba(229,234,242,.08); --sel:rgba(120,160,255,.2);
  --shadow:0 18px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#080b11; --panel:rgba(21,26,35,.82); --panel-solid:#171c26; --win:#1a202b; --win-bar:#232a38;
  --fg:#e5eaf2; --muted:#93a0b4; --line:#2d3545; --hover:rgba(229,234,242,.08); --sel:rgba(120,160,255,.2);
  --shadow:0 18px 44px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;display:flex;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#screen{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:14px;
  border:1px solid var(--line);background:var(--wall-tide)}
#screen[data-wall="tide"]{background:var(--wall-tide)}
#screen[data-wall="dusk"]{background:var(--wall-dusk)}
#screen[data-wall="moss"]{background:var(--wall-moss)}
#screen[data-wall="slate"]{background:var(--wall-slate)}
#desk{flex:1;min-height:0;position:relative;overflow:hidden}

#mark{position:absolute;right:24px;bottom:18px;z-index:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);pointer-events:none;user-select:none}
#mark b{font-size:34px;font-weight:600;letter-spacing:.02em;opacity:.7}
#mark span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
@media (max-width:560px){#mark b{font-size:24px}}
#icons{position:absolute;inset:0;z-index:1;padding:12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.dicon{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1px solid transparent;border-radius:10px;
  background:none;color:#fff;cursor:pointer;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dicon .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px)}
.dicon:hover{background:rgba(255,255,255,.1)}
.dicon.on{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}

.win{position:absolute;display:flex;flex-direction:column;min-width:260px;min-height:160px;background:var(--win);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.win:not(.focus) .tb{opacity:.72}
.win.min{display:none}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0;border:0}
.tb{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;background:var(--win-bar);border-bottom:1px solid var(--line);user-select:none;touch-action:none}
.ti{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:13px}
.ti b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ctl{display:flex;gap:2px}
.ctl button{width:30px;height:26px;border:0;background:none;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.ctl button:hover{background:var(--hover)}
.ctl .x:hover{background:var(--bad);color:#fff}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 52%,var(--muted) 52% 58%,transparent 58% 70%,var(--muted) 70% 76%,transparent 76%);opacity:.6}
.win.max .rs{display:none}

#bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);position:relative;z-index:5000}
#start{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
#tasks{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.task{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;white-space:nowrap;max-width:190px;flex:none}
.task span{overflow:hidden;text-overflow:ellipsis}
.task:hover{background:var(--hover)}
.task.on{background:var(--sel);border-color:var(--accent)}
.task.min{opacity:.6}
#clock{font-size:12px;line-height:1.3;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
#clock b{display:block;color:var(--fg);font-weight:600;font-size:13px}

#menu{position:absolute;left:10px;bottom:60px;z-index:6000;width:min(330px,calc(100% - 20px));max-height:calc(100% - 80px);display:flex;flex-direction:column;gap:10px;padding:12px;
  background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#menu input{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--win)}
#menu .list{display:flex;flex-direction:column;gap:2px;overflow:auto}
#menu .item{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
#menu .item:hover,#menu .item:focus-visible{background:var(--hover)}
#menu .foot{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}

.btn{height:28px;padding:0 10px;border:1px solid var(--line);background:var(--win);border-radius:6px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}

/* Files */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.fbar .path{flex:1;min-width:90px;font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.addrow input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--win)}
.fmain{flex:1;min-height:0;display:flex}
.places{width:128px;flex:none;display:flex;flex-direction:column;gap:2px;padding:8px;border-right:1px solid var(--line);background:var(--win-bar)}
.places button{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:12.5px;cursor:pointer;text-align:left}
.places button:hover{background:var(--hover)}
.flist{flex:1;min-width:0;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:1px}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;height:32px;padding:0 8px;border:0;border-radius:6px;background:none;text-align:left;cursor:default;font-size:13px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sz{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.empty{margin:20px;color:var(--muted);text-align:center}
.fstat{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.fstat.bad,.nstat.bad{color:var(--bad)}
@media (max-width:560px){.places{display:none}}

/* Terminal */
.term{flex:1;min-height:0;overflow:auto;padding:10px 12px;background:var(--term-bg);color:var(--term-fg);font-family:var(--mono);font-size:12.5px;line-height:1.5}
.term .out>div{white-space:pre-wrap;word-break:break-word}
.term .ps{color:#7fd1a8}
.term .d{color:#7ab4ff}
.term .err{color:#ff8f86}
.term .m{color:#8795ab}
.term .in{display:flex;gap:8px}
.term .in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:inherit;padding:0}

/* Notes */
.nbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.nbar input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--win);font-family:var(--mono);font-size:12px}
.body textarea{flex:1;min-height:0;border:0;outline:0;resize:none;padding:12px;background:var(--win);font-family:var(--mono);font-size:13px;line-height:1.55}
.nstat{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* Calculator */
.calc{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px;outline:0}
.cdisp{padding:8px 10px;border-radius:8px;background:var(--win-bar);text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end}
.cdisp small{color:var(--muted);font-size:12px;min-height:16px;font-variant-numeric:tabular-nums}
.cdisp output{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.ckeys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ckeys button{border:1px solid var(--line);border-radius:8px;background:var(--win);font-size:17px;cursor:pointer;min-height:40px}
.ckeys button:hover{background:var(--hover)}
.ckeys .op{background:var(--sel)}
.ckeys .eq{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.ckeys .z{grid-column:span 2}

/* Sketch */
.ptools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.ptools .sw{display:flex;gap:6px}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.ptools label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.pwrap{flex:1;min-height:0;overflow:auto;padding:10px;background:var(--win-bar)}
.pwrap canvas{display:block;width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:crosshair;touch-action:none}

/* Activity */
.act{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.act table{width:100%;border-collapse:collapse;font-size:13px}
.act th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.act th,.act td{padding:6px 4px;border-bottom:1px solid var(--line)}
.act td:last-child{text-align:right}

/* Settings */
.set{padding:14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.set h3{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.set p{margin:0 0 8px;color:var(--muted);line-height:1.5;max-width:60ch}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.set .sw{display:flex;gap:10px;flex-wrap:wrap}
.set .sw button{width:32px;height:32px}
.set .sw.wall button{width:56px;height:34px;border-radius:8px}

/* Account gate */
#gate{position:absolute;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:rgba(8,12,22,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#gate[hidden]{display:none}
.gcard{width:min(360px,100%);margin:auto;display:flex;flex-direction:column;gap:6px;padding:22px;background:var(--panel-solid);color:var(--fg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.glogo{color:var(--accent);display:flex}
.gcard h2{margin:4px 0 0;font-size:22px;letter-spacing:.02em}
.gsub{margin:0 0 8px;color:var(--muted)}
.gcard label{font-size:12px;color:var(--muted);margin-top:6px}
.gcard input{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--win);color:var(--fg)}
.gcard textarea{min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--win);color:var(--fg);font-family:var(--mono);font-size:11.5px}
.gerr{margin:6px 0 0;min-height:18px;font-size:12.5px;color:var(--bad)}
.gbtn{height:38px;justify-content:center;font-size:14px}
.glink{border:0;background:none;color:var(--accent);cursor:pointer;padding:8px 0 2px;font-size:13px;text-align:center}
.glink:hover{text-decoration:underline}
.gfine{margin:8px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
#menu .who{font-size:12.5px;color:var(--muted);padding:2px 4px}
#menu .who b{color:var(--fg)}
/* Members and ranks */
.rk{display:inline-block;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;line-height:17px;color:#fff;letter-spacing:.02em;vertical-align:1px;white-space:nowrap}
.rk-owner{background:var(--r-owner)}.rk-coowner{background:var(--r-coowner)}.rk-admin{background:var(--r-admin)}.rk-mod{background:var(--r-mod)}.rk-member{background:var(--r-member)}
.mem{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.mnote{margin:0;font-size:13px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mrow2{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--win)}
.mrow2 .mn{flex:1;min-width:80px;font-weight:500;overflow-wrap:anywhere}
.msel{height:28px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--win);color:var(--fg)}
.rk-banned{background:var(--bad)}
.mgift{margin:0;min-height:18px;font-size:12.5px;color:var(--ok)}
.claim{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.claim[hidden]{display:none}
.claim summary{cursor:pointer;font-size:13px;color:var(--muted)}
.cform{display:flex;gap:6px;margin-top:8px}
.cform input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--win);color:var(--fg)}
.mem .xta{flex:none;width:100%;min-height:76px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--win);color:var(--fg);font-family:var(--mono);font-size:11.5px;resize:vertical}
.xfer .arow{margin-top:8px}
.cmsg{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.mfine{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.mt .rk{margin:0 2px}
/* Staff */
.stf{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.stf .atx{min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--win);color:var(--fg);font-family:var(--font);font-size:13.5px;flex:none}
.stf .atx1{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--win);color:var(--fg)}
.arow{display:flex;gap:8px;flex-wrap:wrap}
.lt{color:var(--muted);font-size:12px;white-space:nowrap}
.mlist .none{border:0;background:none;color:var(--muted);padding:4px 2px}
.sfs{border:1px solid var(--line);border-radius:10px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;margin:0}
.sfs legend{font-size:12px;color:var(--muted);padding:0 4px}
.sfs label{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4}
.rk-pending{background:var(--r-member)}
#ann{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4500;width:min(540px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--panel-solid);color:var(--fg);border:1px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);align-items:flex-start}
#ann[hidden]{display:none}
#ann b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
#ann .at{line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
/* Music */
.mus{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.npcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--win-bar);display:flex;flex-direction:column;gap:10px}
.npinfo{display:flex;flex-direction:column;gap:2px}
.nptitle{font-size:18px}
.npmood{font-size:12.5px;color:var(--muted)}
.npcard canvas{width:100%;height:64px;display:block}
.npctl{display:flex;align-items:center;justify-content:center;gap:12px}
.ibtn{min-width:44px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--win);cursor:pointer;font-size:11px;letter-spacing:-2px;padding:0 12px}
.ibtn:hover{background:var(--hover)}
.bigp{height:44px;min-width:104px;justify-content:center;font-size:14px;border-radius:22px}
.vol{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.vol input{flex:1;min-width:0}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.trk{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--win);cursor:pointer;text-align:left}
.trk:hover{background:var(--hover)}
.trk[aria-current="true"]{border-color:var(--accent);background:var(--sel)}
.trk span{color:var(--muted);font-size:12.5px}

/* Terminal */
function mountTerm(w,b){
  let cwd=['home','user'];
  b.innerHTML=`<div class="term"><div class="out"></div><form class="in"><span class="ps"></span><input autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command"></form></div>`;
  const term=$('.term',b),out=$('.out',b),form=$('.in',b),inp=$('input',b),ps=$('.ps',form);
  const hist=[];let hi=0;
  const pretty=()=>{const p=toPath(cwd);return p==='/home/user'?'~':p.startsWith('/home/user/')?'~'+p.slice(10):p};
  const setPs=()=>{ps.textContent='user@'+hostName()+':'+pretty()+'$'};
  const scroll=()=>{term.scrollTop=term.scrollHeight};
  const print=(t,c)=>{const d=el('div',c||'');d.textContent=t;out.append(d);scroll()};
  const html=h=>{out.append(el('div','',h));scroll()};
  const R=a=>norm(a,toPath(cwd));
  const ents=n=>Object.entries(n.c).sort((a,c)=>a[1].t===c[1].t?a[0].localeCompare(c[0]):a[1].t==='d'?-1:1);
  const clone=n=>JSON.parse(JSON.stringify(n));
  const HELP=`Commands
  ls [-l] [path]      list files           cd [path]         change folder
  pwd                 current folder       cat <file>        show a file
  mkdir <name>        new folder           touch <file>      new empty file
  echo text [> file]  print or write       rm [-r] <path>    delete
  mv <from> <to>      move or rename       cp <from> <to>    copy
  open <app|file>     open an app or file  apps              list apps
  ps / kill <id>      windows              theme <mode>      light, dark or auto
  neofetch            system summary       date, whoami, history, clear, reboot`;
  function run(line){
    html(`<span class="ps">${esc(ps.textContent)}</span> ${esc(line)}`);
    const toks=(line.match(/"[^"]*"|'[^']*'|\S+/g)||[]).map(t=>/^["'].*["']$/.test(t)?t.slice(1,-1):t);
    if(!toks.length)return;
    const [cmd,...args]=toks;
    const err=m=>print(m,'err');
    switch(cmd){
      case 'help':print(HELP);break;
      case 'clear':out.innerHTML='';break;
      case 'pwd':print(toPath(cwd));break;
      case 'whoami':print('user');break;
      case 'date':print(new Date().toString());break;
      case 'history':print(hist.map((h,i)=>String(i+1).padStart(3)+'  '+h).join('\n'));break;
      case 'reboot':restart();break;
      case 'apps':print(Object.keys(APPS).join('  '));break;
      case 'ls':{
        const long=args.includes('-l'),t=args.find(a=>!a.startsWith('-')),parts=t?R(t):cwd,n=get(parts);
        if(!n)return err(`ls: cannot access '${t}': No such file or directory`);
        if(n.t==='f')return print(t);
        const e=ents(n);if(!e.length)return;
        const nm=([k,v])=>v.t==='d'?`<span class="d">${esc(k)}/</span>`:esc(k);
        html(long?e.map(x=>`${x[1].t==='d'?'d':'-'}rw-  ${String(x[1].t==='d'?Object.keys(x[1].c).length:x[1].c.length).padStart(6)}  ${nm(x)}`).join('\n'):e.map(nm).join('  '));
        break;
      }
      case 'cd':{
        const p=args[0]?R(args[0]):['home','user'],n=get(p);
        if(!n)return err(`cd: ${args[0]}: No such file or directory`);
        if(n.t!=='d')return err(`cd: ${args[0]}: Not a directory`);
        cwd=p;setPs();break;
      }
      case 'cat':{
        if(!args.length)return err('cat: missing file name');
        for(const a of args){const n=get(R(a));if(!n)err(`cat: ${a}: No such file or directory`);else if(n.t==='d')err(`cat: ${a}: Is a directory`);else print(n.c)}
        break;
      }
      case 'mkdir':{
        if(!args.length)return err('mkdir: missing name');
        for(const a of args){const e=mk(R(a),'d');if(e)err(`mkdir: ${a}: ${e}`)}break;
      }
      case 'touch':{
        if(!args.length)return err('touch: missing file name');
        for(const a of args){if(!get(R(a))){const e=mk(R(a),'f');if(e)err(`touch: ${a}: ${e}`)}}break;
      }
      case 'echo':{
        const i=args.findIndex(a=>a==='>'||a==='>>');
        if(i<0)return print(args.join(' '));
        const text=args.slice(0,i).join(' '),tgt=args[i+1];
        if(!tgt)return err('echo: missing file after redirect');
        const parts=R(tgt),ex=get(parts);
        const e=writeFile(parts,args[i]==='>>'&&ex&&ex.t==='f'?ex.c+text+'\n':text+'\n');
        if(e)err(`echo: ${tgt}: ${e}`);break;
      }
      case 'rm':{
        const rec=args.includes('-r'),t=args.filter(a=>!a.startsWith('-'));
        if(!t.length)return err('rm: missing path');
        for(const a of t){
          const n=get(R(a));if(!n){err(`rm: ${a}: No such file or directory`);continue}
          if(n.t==='d'&&!rec){err(`rm: ${a}: Is a folder (use -r)`);continue}
          const e=rmNode(R(a));if(e)err(`rm: ${a}: ${e}`);
        }
        break;
      }
      case 'mv':case 'cp':{
        if(args.length<2)return err(`${cmd}: needs a source and a destination`);
        const sp=R(args[0]),dp=R(args[1]),s=get(sp);
        if(!s)return err(`${cmd}: ${args[0]}: No such file or directory`);
        let d=get(dp),target=dp;
        if(d&&d.t==='d')target=[...dp,sp[sp.length-1]];
        if(!sp.length)return err(`${cmd}: cannot move the root folder`);
        if(toPath(target).startsWith(toPath(sp)+'/'))return err(`${cmd}: cannot copy a folder into itself`);
        const par=get(target.slice(0,-1));
        if(!par||par.t!=='d'||!target.length)return err(`${cmd}: ${args[1]}: No such directory`);
        const copy=clone(s);
        if(cmd==='mv')rmNode(sp);
        get(target.slice(0,-1)).c[target[target.length-1]]=copy;changed();break;
      }
      case 'ps':html('<span class="m">ID  APP        TITLE</span>\n'+([...wins.values()].map(x=>`${String(x.id).padEnd(3)} ${x.app.padEnd(10)} ${esc(x.title)}`).join('\n')||'(no windows)'));break;
      case 'kill':{
        const x=wins.get(+args[0]);if(!x)return err(`kill: no window with id ${args[0]||''}`);closeWin(x);break;
      }
      case 'theme':{
        if(!['light','dark','auto'].includes(args[0]))return err('usage: theme light|dark|auto');
        prefs.theme=args[0];applyPrefs();savePrefs();print('Theme set to '+args[0]);break;
      }
      case 'open':{
        if(!args.length)return err('usage: open <app or file>');
        const a=args[0].toLowerCase();
        if(APPS[a]){openApp(a);break}
        const n=get(R(args[0]));
        if(!n)return err(`open: ${args[0]}: not an app or file`);
        if(n.t==='d')openApp('files',{path:R(args[0])});else openApp('notes',{path:R(args[0])});
        break;
      }
      case 'neofetch':{
        const up=Math.floor((Date.now()-t0)/1000),m=Math.floor(up/60);

/* Calculator */
function mountCalc(w,b){
  let cur='0',prev=null,op=null,fresh=true,expr='';
  b.innerHTML=`<div class="calc" tabindex="0" aria-label="Calculator"><div class="cdisp"><small></small><output aria-live="polite">0</output></div><div class="ckeys"></div></div>`;
  const root=$('.calc',b),small=$('small',b),outp=$('output',b),keys=$('.ckeys',b);
  const fmt=n=>isFinite(n)?String(parseFloat(n.toPrecision(12))):'Error';
  const calc=(a,c,o)=>o==='+'?a+c:o==='−'?a-c:o==='×'?a*c:c===0?NaN:a/c;
  const show=()=>{outp.textContent=cur;small.textContent=expr};
  function press(k){
    if(/^\d$/.test(k)){if(fresh){cur=k;fresh=false}else if(cur.length<14)cur=cur==='0'?k:cur+k}
    else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
    else if(k==='AC'){cur='0';prev=null;op=null;fresh=true;expr=''}
    else if(k==='±'){if(cur!=='0'&&cur!=='Error')cur=cur.startsWith('-')?cur.slice(1):'-'+cur}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100);fresh=true}
    else if(k==='='){if(op!==null){const r=calc(prev,parseFloat(cur),op);expr=`${fmt(prev)} ${op} ${cur} =`;cur=fmt(r);prev=null;op=null;fresh=true}}
    else{
      if(op!==null&&!fresh){const r=calc(prev,parseFloat(cur),op);prev=r;cur=fmt(r)}else prev=parseFloat(cur);
      op=k;fresh=true;expr=`${fmt(prev)} ${op}`;
    }
    show();
  }
  const layout=['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  for(const k of layout){
    const x=el('button',(/[÷×−+]/.test(k)?'op ':'')+(k==='='?'eq ':'')+(k==='0'?'z':''),k);x.type='button';
    x.onclick=()=>press(k);keys.append(x);
  }
  const map={'/':'÷','*':'×','-':'−','+':'+','Enter':'=','=':'=','Escape':'AC','%':'%','.':'.'};
  root.addEventListener('keydown',e=>{
    if(/^\d$/.test(e.key))press(e.key);else if(map[e.key]){e.preventDefault();press(map[e.key])}
    else if(e.key==='Backspace'&&!fresh){cur=cur.length>1?cur.slice(0,-1):'0';show()}
  });
  show();
}

function mountPaint(w,b){

    g.fillStyle='#2f5a4d';g.beginPath();g.moveTo(0,420);g.lineTo(0,360);g.quadraticCurveTo(220,310,420,370);g.quadraticCurveTo(580,400,720,350);g.lineTo(720,420);g.fill();

    x.onclick=()=>{color=c;erase=false;$('[data-k=eraser]',b).setAttribute('aria-pressed','false');$$('.sw button').forEach(y=>{if(b.contains(y))y.setAttribute('aria-pressed',y===x)})};

  $('[data-k=clear]',b).onclick=()=>{g.fillStyle='#fff';g.fillRect(0,0,720,420)};
  let last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);last=pt(e);dot(last)});
  function dot(p){g.fillStyle=erase?'#fff':color;g.beginPath();g.arc(p[0],p[1],range.value/2,0,7);g.fill()}
  cv.addEventListener('pointermove',e=>{
    if(!last)return;const p=pt(e);
    g.strokeStyle=erase?'#fff':color;g.lineWidth=+range.value;g.lineCap='round';
    g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p;

/* Chat: one shared room. Everyone with an account in this browser sees every message. */
function mountChat(w,b){
  const CK='halcyon.chatall';
  const read=()=>{try{const a=JSON.parse(localStorage.getItem(CK)||'[]');return Array.isArray(a)?a.filter(m=>m&&typeof m.t==='string'&&m.t&&typeof m.at==='number'&&typeof m.u==='string'):[]}catch(e){return[]}};
  const write=a=>{try{localStorage.setItem(CK,JSON.stringify(a.slice(-300)))}catch(e){}};
  b.innerHTML=`<div class="chat"><div class="msgs" aria-live="polite"></div><form class="cin"><label class="sr" for="cm${w.id}">Message</label><textarea id="cm${w.id}" maxlength="500" placeholder="Message everyone" autocomplete="off"></textarea><button class="btn pri">Send</button></form><div class="cfoot"><span class="cnote">Everyone with an account here can see this chat.</span><button type="button" class="btn" data-k="clear" hidden>Clear for everyone</button></div></div>`;
  const msgs=$('.msgs',b),form=$('.cin',b),ta=$('textarea',b),clr=$('[data-k=clear]',b);
  let armed=false,shown=-1;

  const bubble=m=>{
    const mine=m.u===uid,row=el('div','mrow'+(mine?'':' other')),d=el('div','msg '+(mine?'user':'ai'));d.textContent=m.t;
    const tm=el('time','mt');tm.dateTime=new Date(m.at).toISOString();
    tm.append((accts[m.u]?accts[m.u].name:m.n||'Unknown')+' ');
    if(accts[m.u])tm.append(rankBadge(m.u),' ');
    tm.append('· '+stamp(m.at));
    row.append(d,tm);return row;
  };
  function render(){
    const all=read();
    clr.hidden=rankIdx(uid)<1||!all.length;
    if(!all.length){shown=0;msgs.innerHTML='<p class="hint">No messages yet. Write the first one and everyone will see it.</p>';return}
    const atEnd=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<60;
    msgs.innerHTML='';all.forEach(m=>msgs.append(bubble(m)));

  }

    e.preventDefault();const v=ta.value.trim();if(!v||!uid)return;
    const all=read();all.push({t:v,at:Date.now(),u:uid,n:acctName});write(all);
    ta.value='';render();msgs.scrollTop=msgs.scrollHeight;bus.dispatchEvent(new Event('chat'));
  });
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
  clr.onclick=()=>{
    if(rankIdx(uid)<1)return;
    if(!armed){armed=true;clr.textContent='Click again to clear';setTimeout(()=>{armed=false;clr.textContent='Clear for everyone'},3000);return}
    write([]);logAct(actor()+' cleared the chat');armed=false;clr.textContent='Clear for everyone';render();bus.dispatchEvent(new Event('chat'));
  };
  const onBus=()=>render();
  const onStore=e=>{if(e.key===CK||e.key===ACCT)render()};
  bus.addEventListener('chat',onBus);addEventListener('storage',onStore);
  w.cleanup.push(()=>{bus.removeEventListener('chat',onBus);removeEventListener('storage',onStore)});
  render();
  if(!coarse)setTimeout(()=>ta.focus(),30);
}

function mountCalendar(w,b){

  const parse=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
  const today=new Date();
  if(ev===null)ev=[{id:'seed',d:iso(today),t:'Try adding an event',h:''}];
  let view=new Date(today.getFullYear(),today.getMonth(),1),sel=iso(today);

  b.innerHTML=`<div class="cal"><div class="chead"><button type="button" class="btn" data-k="prev" aria-label="Previous month">‹</button><b class="cm"></b><button type="button" class="btn" data-k="next" aria-label="Next month">›</button><button type="button" class="btn" data-k="today">Today</button></div><div class="cgrid"></div><div class="cday"><h4></h4><ul></ul><form class="cadd"><label class="sr" for="ct${w.id}">Event title</label><input id="ct${w.id}" class="tt" placeholder="Add an event" autocomplete="off"><label class="sr" for="ch${w.id}">Time</label><input id="ch${w.id}" type="time"><button class="btn pri">Add</button></form></div></div>`;
  const grid=$('.cgrid',b),cm=$('.cm',b),h4=$('h4',b),ul=$('ul',b),tin=$('.tt',b),hin=$('input[type=time]',b);
  const fmtTime=h=>{const p=h.split(':');return new Date(2000,0,1,+p[0],+p[1]).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
  function render(){
    cm.textContent=view.toLocaleDateString([],{month:'long',year:'numeric'});
    grid.innerHTML='';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n=>grid.append(el('div','wd',n)));

    for(let i=0;i<first;i++)grid.append(el('div'));

      const id=iso(new Date(view.getFullYear(),view.getMonth(),n)),c=ev.filter(e=>e.d===id).length;
      const x=el('button','d'+(id===sel?' sel':'')+(id===iso(today)?' today':''),`<span>${n}</span><i>${'<em></em>'.repeat(Math.min(c,3))}</i>`);
      x.type='button';x.setAttribute('aria-label',parse(id).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+(c?', '+c+' event'+(c===1?'':'s'):''));
      x.onclick=()=>{sel=id;render()};
      grid.append(x);
    }
    h4.textContent=parse(sel).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
    const list=ev.filter(e=>e.d===sel).sort((a,c)=>(a.h||'99').localeCompare(c.h||'99'));
    ul.innerHTML=list.length?'':'<li class="none">No events.</li>';
    for(const e of list){
      const li=el('li','',`<span class="tm">${e.h?esc(fmtTime(e.h)):'All day'}</span><span class="ttl"></span>`);
      $('.ttl',li).textContent=e.t;
      const x=el('button','btn','Delete');x.type='button';x.setAttribute('aria-label','Delete '+e.t);
      x.onclick=()=>{ev=ev.filter(y=>y!==e);save();render()};
      li.append(x);ul.append(li);
    }
  }
  b.addEventListener('click',e=>{
    const k=e.target.closest('[data-k]');if(!k)return;
    if(k.dataset.k==='prev')view=new Date(view.getFullYear(),view.getMonth()-1,1);
    if(k.dataset.k==='next')view=new Date(view.getFullYear(),view.getMonth()+1,1);
    if(k.dataset.k==='today'){view=new Date(today.getFullYear(),today.getMonth(),1);sel=iso(today)}
    render();
  });
  $('.cadd',b).addEventListener('submit',e=>{
    e.preventDefault();const t=tin.value.trim();if(!t)return;
    ev.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),d:sel,t,h:hin.value||''});
    save();tin.value='';hin.value='';render();
  });
  render();
}

/* Weather: search any city, then show its live forecast (Open-Meteo, no key needed) */
function mountWeather(w,b){
  const KEY='halcyon.wx.city',UKEY='halcyon.wx.unit';
  let city=null,unit='F',ctl=null;
  try{const c=JSON.parse(ls.getItem(KEY)||'null');if(c&&typeof c.name==='string'&&isFinite(c.lat)&&isFinite(c.lon))city=c;if(ls.getItem(UKEY)==='C')unit='C'}catch(e){}
  const SAMPLE={place:'Sample forecast',sample:true,cur:{t:50,text:'Clear',kind:'sun',day:false},
    days:[['2026-11-10',58,43,10,'sun'],['2026-11-11',60,45,10,'sun'],['2026-11-12',57,44,75,'rain'],['2026-11-13',44,38,40,'cloud'],['2026-11-14',46,37,15,'partly'],['2026-11-15',50,37,0,'sun'],['2026-11-16',52,35,10,'sun']]};
  const KIND=c=>c===0?'sun':c<=2?'partly':c===3?'cloud':(c===45||c===48)?'fog':(c>=51&&c<=67)||(c>=80&&c<=82)?'rain':(c>=71&&c<=77)||c===85||c===86?'snow':c>=95?'storm':'cloud';
  const TEXT={sun:'Clear',partly:'Partly cloudy',cloud:'Cloudy',fog:'Fog',rain:'Rain',snow:'Snow',storm:'Thunderstorm'};
  const pd=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
  b.innerHTML=`<div class="wx"><form class="wsearch"><label class="sr" for="ws${w.id}">City</label><input id="ws${w.id}" placeholder="Search for your city" autocomplete="off"><button class="btn pri">Search</button><button type="button" class="btn" data-k="unit" aria-label="Switch temperature unit"></button></form><div class="wres" hidden></div><p class="wmsg" aria-live="polite" hidden></p><section class="wnow"></section><h4 class="wlabel whead" hidden>Next days</h4><ul class="wdays"></ul><p class="wfine"></p></div>`;
  const form=$('.wsearch',b),inp=$('input',form),unitBtn=$('[data-k=unit]',b),res=$('.wres',b),msg=$('.wmsg',b),hero=$('.wnow',b),head=$('.whead',b),list=$('.wdays',b),fine=$('.wfine',b);
  const say=(t,bad)=>{msg.hidden=!t;msg.textContent=t||'';msg.classList.toggle('bad',!!bad)};
  const syncUnit=()=>{unitBtn.textContent='°'+unit;unitBtn.title='Showing °'+unit+'. Click to switch.'};
  const cv=f=>unit==='C'?Math.round((f-32)*5/9):Math.round(f);
  function show(d){
    const days=d.days;
    const dn=(s,i)=>i===0?'Today':i===1?'Tomorrow':pd(s).toLocaleDateString([],{weekday:'long'});
    const t=d.cur,td=days[0];
    hero.dataset.k=d.sample?'':(t.kind==='sun'&&!t.day?'night':t.kind);
    if(d.sample)hero.dataset.k='cloud';
    hero.innerHTML=`<div class="wl"><span class="wplace"></span><b class="wbig"></b><span class="wdesc"></span><span class="whl"></span></div><span class="wico hero">${ic(t.kind==='sun'&&!t.day?'w_moon':'w_'+t.kind,84)}</span>`;
    $('.wplace',hero).textContent=d.place;$('.wbig',hero).textContent=cv(t.t)+'°';$('.wdesc',hero).textContent=t.text;
    $('.whl',hero).textContent=td?'High '+cv(td[1])+'° · Low '+cv(td[2])+'°':'';
    list.innerHTML='';
    const rest=days.slice(1);head.hidden=!rest.length;
    const lo=Math.min(...days.map(x=>x[2])),hi=Math.max(...days.map(x=>x[1])),span=Math.max(1,hi-lo);
    rest.forEach((x,i)=>{
      const li=el('li','',`<span class="dn"></span><span class="wico">${ic('w_'+x[4],22)}</span><span class="dp"></span><span class="dl"></span><span class="dbar"><i></i></span><span class="dh"></span>`);
      $('.dn',li).textContent=dn(x[0],i+1);$('.dp',li).textContent=x[3]>=10?x[3]+'%':'';
      $('.dl',li).textContent=cv(x[2])+'°';$('.dh',li).textContent=cv(x[1])+'°';
      const f=$('i',li);f.style.left=((x[2]-lo)/span*100)+'%';f.style.width=Math.max(6,(x[1]-x[2])/span*100)+'%';

  }
  async function getJSON(url){
    if(ctl)ctl.abort();ctl=new AbortController();

  }
  async function load(c){

        res.append(bt);
      });
    }catch(e){
      if(e&&e.name==='AbortError')return;
      say('City search is not available here. Some viewers block outside requests. Try the downloaded or hosted copy of this OS.',true);
    }
  }
  let last=null;
  const origShow=show;
  form.addEventListener('submit',e=>{e.preventDefault();const q=inp.value.trim();if(q)search(q)});
  unitBtn.onclick=()=>{unit=unit==='F'?'C':'F';try{ls.setItem(UKEY,unit)}catch(e){}syncUnit();if(city)load(city);else show(SAMPLE)};
  w.cleanup.push(()=>{if(ctl)ctl.abort()});

/* Games: Snake, Tic-Tac-Toe, Memory */
function mountGames(w,b){
  b.innerHTML=`<div class="gm"><div class="gtabs" role="tablist"></div><div class="gbody"></div></div>`;
  const tabs=$('.gtabs',b),body=$('.gbody',b);
  let stop=null;
  const GAMES=[['snake','Snake',snake],['ttt','Tic-Tac-Toe',ttt],['mem','Memory',memory]];
  const best=k=>{try{return +ls.getItem('halcyon.best.'+k)||0}catch(e){return 0}};
  const setBest=(k,v)=>{try{ls.setItem('halcyon.best.'+k,String(v))}catch(e){}};
  function open(id){
    if(stop){stop();stop=null}
    body.innerHTML='';
    $$('.gtabs button').forEach(x=>{if(b.contains(x))x.setAttribute('aria-selected',x.dataset.id===id)});
    const g=GAMES.find(x=>x[0]===id);stop=g[2](body)||null;
  }
  for(const [id,name] of GAMES){
    const x=el('button','gtab',name);x.type='button';x.dataset.id=id;x.setAttribute('role','tab');x.onclick=()=>open(id);tabs.append(x);
  }
  w.cleanup.push(()=>{if(stop)stop()});

  function snake(root){
    const N=18,C=20;
    root.innerHTML=`<div class="gcol"><div class="gscore"><span>Score <b class="sc">0</b></span><span>Best <b class="bs">${best('snake')}</b></span></div><div class="sw" tabindex="0" aria-label="Snake board. Use the arrow keys."><canvas width="${N*C}" height="${N*C}"></canvas><div class="sov"><b>Snake</b><span>Press an arrow key or Start</span></div></div><div class="gpad"><span></span><button type="button" data-d="u" aria-label="Up">▲</button><span></span><button type="button" data-d="l" aria-label="Left">◀</button><button type="button" data-d="s" class="go">Start</button><button type="button" data-d="r" aria-label="Right">▶</button><span></span><button type="button" data-d="d" aria-label="Down">▼</button><span></span></div></div>`;
    const cv=$('canvas',root),g=cv.getContext('2d'),ov=$('.sov',root),wrap=$('.sw',root),sc=$('.sc',root),bs=$('.bs',root),goBtn=$('.go',root);
    let s,dir,next,food,score,timer=null,over=false;
    const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
    const cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#2f6df6';
    function reset(){s=[[9,9],[8,9],[7,9]];dir=V.r;next=V.r;score=0;over=false;sc.textContent=0;place();draw()}
    function place(){do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(s.some(p=>p[0]===food[0]&&p[1]===food[1]))}
    function draw(){
      g.fillStyle='#10151d';g.fillRect(0,0,N*C,N*C);
      g.fillStyle='rgba(255,255,255,.04)';
      for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)g.fillRect(i*C,j*C,C,C);
      g.fillStyle='#ef6a5b';g.beginPath();g.arc(food[0]*C+C/2,food[1]*C+C/2,C*.36,0,7);g.fill();
      s.forEach((p,i)=>{g.fillStyle=i?cs('--accent'):'#ffffff';g.globalAlpha=i?Math.max(.45,1-i*.03):1;g.fillRect(p[0]*C+1,p[1]*C+1,C-2,C-2)});
      g.globalAlpha=1;
    }
    function step(){
      dir=next;const h=[s[0][0]+dir[0],s[0][1]+dir[1]];
      if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(p=>p[0]===h[0]&&p[1]===h[1]))return end();
      s.unshift(h);
      if(h[0]===food[0]&&h[1]===food[1]){score++;sc.textContent=score;place()}else s.pop();
      draw();
    }
    function start(){
      if(timer)return;if(over||!s)reset();
      ov.hidden=true;goBtn.textContent='Pause';
      timer=setInterval(step,120);
    }
    function pause(){if(timer){clearInterval(timer);timer=null}goBtn.textContent='Start'}
    function end(){
      pause();over=true;ov.hidden=false;
      if(score>best('snake')){setBest('snake',score);bs.textContent=score}
      ov.innerHTML=`<b>Game over</b><span>Score ${score}. Press an arrow key or Start to play again.</span>`;
    }
    function turn(k){
      const d=V[k];if(!d)return;
      if(over)reset();
      if(d[0]!==-dir[0]||d[1]!==-dir[1])next=d;
      start();
    }
    wrap.addEventListener('keydown',e=>{
      const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'}[e.key];
      if(m){e.preventDefault();turn(m)}
      else if(e.key===' '){e.preventDefault();timer?pause():start()}
    });
    root.addEventListener('click',e=>{
      const k=e.target.closest('[data-d]');if(!k)return;
      const d=k.dataset.d;
      if(d==='s'){timer?pause():start()}else turn(d);
      if(!coarse)wrap.focus();
    });
    reset();if(!coarse)wrap.focus();
    return pause;
  }

  function ttt(root){
    root.innerHTML=`<div class="gcol"><div class="gscore"><span>You (X) <b class="wy">0</b></span><span>Draws <b class="wd">0</b></span><span>Computer (O) <b class="wc">0</b></span></div><div class="tgrid"></div><p class="gmsg" aria-live="polite">Your move.</p><button type="button" class="btn">New game</button></div>`;
    const grid=$('.tgrid',root),msg=$('.gmsg',root);
    const tot={y:0,d:0,c:0};let bd,done,lock=null;
    const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const win=p=>L.some(l=>l.every(i=>bd[i]===p));
    const cells=[];
    for(let i=0;i<9;i++){const c=el('button','tc');c.type='button';c.setAttribute('aria-label','Square '+(i+1));c.onclick=()=>play(i);grid.append(c);cells.push(c)}
    function paint(){bd.forEach((v,i)=>{cells[i].textContent=v;cells[i].dataset.p=v;cells[i].disabled=!!v||done})}
    function fin(t){done=true;paint();if(t==='X'){tot.y++;msg.textContent='You win!'}else if(t==='O'){tot.c++;msg.textContent='Computer wins.'}else{tot.d++;msg.textContent="It's a draw."}
      $('.wy',root).textContent=tot.y;$('.wd',root).textContent=tot.d;$('.wc',root).textContent=tot.c}
    function reset(){clearTimeout(lock);bd=Array(9).fill('');done=false;msg.textContent='Your move.';paint()}
    function pick(){
      const find=p=>{for(const l of L){const v=l.map(i=>bd[i]);if(v.filter(x=>x===p).length===2&&v.includes('')) return l[v.indexOf('')]}return -1};
      let m=find('O');if(m<0)m=find('X');
      if(m<0&&!bd[4])m=4;
      if(m<0){const o=[0,2,6,8,1,3,5,7].filter(i=>!bd[i]);m=o[Math.floor(Math.random()*o.length)]}
      return m;
    }
    function play(i){
      if(done||bd[i]||lock)return;
      bd[i]='X';paint();
      if(win('X'))return fin('X');
      if(bd.every(Boolean))return fin('');
      msg.textContent='Computer is thinking…';
      lock=setTimeout(()=>{lock=null;bd[pick()]='O';paint();if(win('O'))return fin('O');if(bd.every(Boolean))return fin('');msg.textContent='Your move.'},350);
    }
    $('.btn',root).onclick=reset;
    reset();
    return()=>clearTimeout(lock);
  }

  function memory(root){
    const SY=['★','♦','●','▲','■','♠','♥','✚'];
    root.innerHTML=`<div class="gcol"><div class="gscore"><span>Moves <b class="mv">0</b></span><span>Best <b class="bm">${best('mem')||'-'}</b></span></div><div class="mgrid"></div><p class="gmsg" aria-live="polite">Match all the pairs.</p><button type="button" class="btn">New game</button></div>`;
    const grid=$('.mgrid',root),msg=$('.gmsg',root),mv=$('.mv',root),bm=$('.bm',root);
    let deck,open,moves,matched,lock=null;
    function reset(){
      clearTimeout(lock);lock=null;
      deck=[...SY,...SY].map(v=>[Math.random(),v]).sort((a,c)=>a[0]-c[0]).map(x=>x[1]);
      open=[];moves=0;matched=0;mv.textContent=0;msg.textContent='Match all the pairs.';grid.innerHTML='';
      deck.forEach((v,i)=>{
        const c=el('button','mc');c.type='button';c.setAttribute('aria-label','Card '+(i+1)+', face down');
        c.innerHTML='<span class="mf"></span><span class="mb">?</span>';$('.mf',c).textContent=v;
        c.onclick=()=>flip(i,c);grid.append(c);
      });
    }
    function flip(i,c){
      if(lock||c.classList.contains('up')||c.classList.contains('ok'))return;
      c.classList.add('up');c.setAttribute('aria-label','Card '+(i+1)+', '+deck[i]);open.push([i,c]);
      if(open.length<2)return;
      moves++;mv.textContent=moves;
      const [a,d]=open;
      if(deck[a[0]]===deck[d[0]]){
        a[1].classList.add('ok');d[1].classList.add('ok');open=[];matched++;
        if(matched===SY.length){msg.textContent='You matched them all in '+moves+' moves.';if(!best('mem')||moves<best('mem')){setBest('mem',moves);bm.textContent=moves}}
      }else{
        lock=setTimeout(()=>{lock=null;a[1].classList.remove('up');d[1].classList.remove('up');a[1].setAttribute('aria-label','Card '+(a[0]+1)+', face down');d[1].setAttribute('aria-label','Card '+(d[0]+1)+', face down');open=[]},750);
      }
    }
    $('.btn',root).onclick=reset;
    reset();
    return()=>clearTimeout(lock);
  }
  open('snake');
}

  function render(){
    const mr=rankIdx(uid);

    for(const key of keys){
      const li=el('li','mrow2'),nm=el('span','mn');
      nm.textContent=accts[key].name+(key===uid?' (you)':'');
      li.append(nm,rankBadge(key));
      if(accts[key].banned)li.append(el('span','rk rk-banned','Banned'));
      if(accts[key].pending)li.append(el('span','rk rk-pending','Pending'));
      const tr=rankIdx(key);
      if(key!==uid&&mr>=2&&mr>tr&&!accts[key].banned&&!accts[key].pending){
        const sel=el('select','msel');sel.setAttribute('aria-label','Rank for '+accts[key].name);
        RANKS.forEach((r,i)=>{if(i<mr){const o=el('option');o.value=r[0];o.textContent=r[1];sel.append(o)}});
        sel.value=accts[key].rank;
        sel.onchange=()=>{if(rankIdx(key)<mr&&RANKS.findIndex(r=>r[0]===sel.value)<mr){accts[key].rank=sel.value;saveA();logAct(actor()+' set '+accts[key].name+' to '+RANKS[rankIdx(key)][1])}armed=null;render()};
        const rm=el('button','btn',armed===key?'Click again to remove':'Remove');rm.type='button';
        rm.onclick=()=>{
          if(armed!==key){armed=key;render();return}
          if(!(rankIdx(key)<mr))return;
          const nm0=accts[key].name;delete accts[key];saveA();logAct(actor()+' removed '+nm0);
          try{for(const k of Object.keys(localStorage))if(k.startsWith('halcyon.u.'+key+'.'))localStorage.removeItem(k)}catch(e){}
          armed=null;render();

      }
      const maxGift=Math.min(rankIdx(uid),3),opts=[];

          }
        };
        li.append(gs);
      }
      if(key!==uid&&mr>=1&&tr<mr&&tr<3&&!accts[key].pending){
        const bb=el('button','btn',accts[key].banned?'Unban':(armedBan===key?'Click again to ban':'Ban'));bb.type='button';
        bb.onclick=()=>{

  };
  $('[data-k=imp]',b).onclick=()=>{
    const ta=$('.ximp textarea',b),r=importCode(ta.value,rankIdx(uid)>=3,actor());
    xmsg.textContent=r.msg;
    if(r.added){ta.value='';render()}
  };
  let tries=0;
  $('.cform',b).addEventListener('submit',async e=>{
    e.preventDefault();
    const out=$('.cmsg',b),inp=$('.cform input',b),code=inp.value.trim().toUpperCase();
    if(!code)return;
    if(Object.keys(accts).some(k=>accts[k].rank==='owner')){out.textContent='This system already has an Owner.';return}
    if(!window.crypto||!crypto.subtle){out.textContent='This browser cannot check the code here.';return}
    const ok=(await derive(code,unb64(OWN_SALT),OWN_ITER))===OWN_HASH;
    if(!ok){tries++;out.textContent='That code is not right.';inp.value='';await new Promise(r=>setTimeout(r,Math.min(5000,tries*800)));return}
    if(!accts[uid]||Object.keys(accts).some(k=>accts[k].rank==='owner'))return;
    accts[uid].rank='owner';saveA();logAct(acctName+' claimed Owner');
    inp.value='';out.textContent='You are now the Owner.';refreshWho();renderIcons();render();
  });
  render();
}

/* Music: tracks are made on the spot with Web Audio, so there are no song files */
function mountMusic(w,b){
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  let ctx=null,an=null,bus=null,pbus=null,nbuf=null;
  let vol=0.7,cur=0,playing=false,timer=null,nextT=0,stepN=0,raf=0,view='play';
  const ui={};
  b.innerHTML=`<div class="gm"><div class="gtabs" role="tablist"></div><div class="mus"></div></div>`;
  const tabs=$('.gtabs',b),root=$('.mus',b);

  /* audio engine */
  function ensure(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{ctx=new AC();an=ctx.createAnalyser();an.fftSize=128;an.smoothingTimeConstant=.8;an.connect(ctx.destination)}catch(e){ctx=null;return false}
    return true;
  }
  function makeBus(){
    const m=ctx.createGain();m.gain.value=vol;
    const fx=ctx.createGain(),d=ctx.createDelay(1.5),fb=ctx.createGain(),wet=ctx.createGain();
    d.delayTime.value=.38;fb.gain.value=.35;wet.gain.value=.28;
    fx.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(m);m.connect(an);
    return {m,fx};
  }
  function killBus(x){if(!x)return;try{x.m.gain.setTargetAtTime(0,ctx.currentTime,.05)}catch(e){}setTimeout(()=>{try{x.m.disconnect()}catch(e){}},700)}
  function tone(f,t,dur,o){
    o=o||{};const B=o.bus||bus;if(!B)return;
    const osc=ctx.createOscillator(),g=ctx.createGain(),fl=ctx.createBiquadFilter();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
    fl.type='lowpass';fl.frequency.value=o.cut||4000;
    const a=o.att||.01,r=o.rel||.1,v=o.vol||.2,h=Math.max(a,dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+h);g.gain.linearRampToValueAtTime(.0001,t+h+r);
    osc.connect(fl);fl.connect(g);g.connect(B.m);
    if(o.echo){const s=ctx.createGain();s.gain.value=o.echo;g.connect(s);s.connect(B.fx)}
    osc.start(t);osc.stop(t+h+r+.05);
  }
  function noise(){
    if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    return nbuf;
  }
  function hit(t,dur,hp,v){
    if(!bus)return;
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    s.buffer=noise();f.type='highpass';f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(bus.m);s.start(t);s.stop(t+dur+.02);
  }
  function kick(t,v){
    if(!bus)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
    o.connect(g);g.connect(bus.m);o.start(t);o.stop(t+.3);
  }

  /* tracks: fn(step, time, secondsPerSixteenth) is called for every 16th note */
  const CH=[[45,57,60,64,71],[41,57,60,65,69],[48,55,59,64,67],[43,55,59,62,64]];
  const PENT=[76,79,81,83,86,88];
  const LC=[[50,53,57,60],[43,53,55,59],[48,52,55,59],[45,52,55,60]],LR=[38,43,36,45];
  const NR=[45,41,48,43],NC=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  const MB=[60,62,64,67,69,72,74,76,79,81],MR=[48,45,41,43];
  let mbPos=4;
  const TRACKS=[
    {name:'Slow Tide',mood:'Ambient pads',bpm:60,fn(i,t,s){
      if(i%32===0)CH[Math.floor(i/32)%4].forEach((m,k)=>tone(mtof(m),t,s*30,{type:k?'triangle':'sine',att:2.2,rel:3,vol:k?.05:.09,cut:900,echo:.5}));
      if(i%4===0&&Math.random()<.3)tone(mtof(PENT[Math.floor(Math.random()*PENT.length)]),t,.01,{att:.005,rel:2.4,vol:.07,echo:.8});
    }},
    {name:'Lo-fi Loop',mood:'Chill beat',bpm:78,fn(i,t,s){
      const bar=Math.floor(i/16)%4,p=i%16,c=LC[bar];
      if(p===0||p===10)kick(t,.6);
      if(p===4||p===12)hit(t,.14,1800,.35);
      if(p%2===0)hit(t,.04,7000,p%4===0?.18:.1);
      if(p===0||p===6||p===10)c.forEach(m=>tone(mtof(m),t+Math.random()*.012,s*2.2,{type:'triangle',att:.01,rel:.25,vol:.07,cut:1500,echo:.25}));
      if(p===0||p===7||p===10)tone(mtof(LR[bar]),t,s*2,{type:'sine',att:.01,rel:.15,vol:.22,cut:400});
    }},
    {name:'Night Drive',mood:'Synth groove',bpm:100,fn(i,t,s){
      const bar=Math.floor(i/16)%4,p=i%16,c=NC[bar];
      if(p%4===0)kick(t,.75);
      if(p===4||p===12)hit(t,.18,1200,.3);
      if(p%4===2)hit(t,.05,8000,.14);
      tone(mtof(NR[bar]),t,s*.8,{type:'sawtooth',att:.005,rel:.05,vol:.09,cut:p%4===0?700:450});
      if(p%2===0){const k=p/2;tone(mtof(c[k%3]+12+(k%4===3?12:0)),t,s*1.4,{type:'sawtooth',att:.005,rel:.2,vol:.045,cut:2400,echo:.5})}
    }},
    {name:'Music Box',mood:'Gentle melody',bpm:90,fn(i,t,s){
      const bar=Math.floor(i/16)%4,p=i%16;
      if(p%4===0)tone(mtof(MR[bar]),t,s*3,{type:'sine',att:.02,rel:.5,vol:.12,cut:600});
      if(p%2===0&&Math.random()<.62){
        mbPos=Math.max(0,Math.min(MB.length-1,mbPos+Math.floor(Math.random()*5)-2));
        const f=mtof(MB[mbPos]);
        tone(f,t,.01,{att:.004,rel:1.7,vol:.09,echo:.7});tone(f*2.005,t,.01,{att:.004,rel:.6,vol:.025});
      }
    }}
  ];
  function schedule(){
    const T=TRACKS[cur],s=60/T.bpm/4;
    while(nextT<ctx.currentTime+.15){T.fn(stepN,nextT,s);nextT+=s;stepN++}
  }
  function play(){
    if(!ensure()){say('Sound is not available in this browser.');return}
    if(ctx.state==='suspended')ctx.resume();
    if(playing)return;
    playing=true;bus=makeBus();nextT=ctx.currentTime+.06;stepN=0;
    timer=setInterval(schedule,40);draw();sync();
  }
  function pause(){
    playing=false;clearInterval(timer);timer=null;
    if(ctx)killBus(bus);bus=null;draw();sync();
  }
  function pick(i,go){
    cur=(i+TRACKS.length)%TRACKS.length;
    const was=playing||go;
    if(playing)pause();
    if(was)play();else sync();
  }
  function say(t){if(ui.msg)ui.msg.textContent=t}

  /* player view */
  function draw(){
    cancelAnimationFrame(raf);
    const cv=ui.cv;if(!cv)return;
    const g=cv.getContext('2d'),W=cv.width,H=cv.height,data=new Uint8Array(an?an.frequencyBinCount:0);
    const col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#2f6df6';
    const loop=()=>{
      g.clearRect(0,0,W,H);
      if(an&&playing){
        an.getByteFrequencyData(data);const n=32,bw=W/n;g.fillStyle=col;
        for(let k=0;k<n;k++){const h=Math.max(2,data[k]/255*H);g.fillRect(k*bw+2,H-h,bw-4,h)}
      }
      if(playing&&ui.cv===cv)raf=requestAnimationFrame(loop);
    };
    loop();
  }
  function sync(){
    if(!ui.title)return;
    const T=TRACKS[cur];
    ui.title.textContent=T.name;ui.mood.textContent=T.mood+' · '+T.bpm+' BPM';
    ui.play.textContent=playing?'Pause':'Play';ui.play.setAttribute('aria-label',playing?'Pause':'Play');
    $$('.trk').forEach(x=>{if(root.contains(x))x.setAttribute('aria-current',+x.dataset.i===cur)});
  }
  function viewPlay(){
    root.innerHTML=`<div class="npcard"><div class="npinfo"><b class="nptitle"></b><span class="npmood"></span></div><canvas width="320" height="64" aria-hidden="true"></canvas><div class="npctl"><button type="button" class="ibtn" data-k="prev" aria-label="Previous track">&#9664;&#9664;</button><button type="button" class="btn pri bigp" data-k="play">Play</button><button type="button" class="ibtn" data-k="next" aria-label="Next track">&#9654;&#9654;</button></div><label class="vol">Volume <input type="range" min="0" max="100" aria-label="Volume"></label></div><ul class="tlist"></ul><p class="mfine">These tracks are made on the spot by your browser, so there are no song files to download.</p><p class="mgift"></p>`;
    ui.title=$('.nptitle',root);ui.mood=$('.npmood',root);ui.cv=$('canvas',root);ui.play=$('[data-k=play]',root);ui.msg=$('.mgift',root);
    const vr=$('input[type=range]',root);vr.value=Math.round(vol*100);
    vr.oninput=()=>{vol=vr.value/100;if(bus)bus.m.gain.value=vol;if(pbus)pbus.m.gain.value=vol};
    ui.play.onclick=()=>{playing?pause():play()};
    $('[data-k=prev]',root).onclick=()=>pick(cur-1);
    $('[data-k=next]',root).onclick=()=>pick(cur+1);
    const ul=$('.tlist',root);
    TRACKS.forEach((T,i)=>{
      const li=el('li'),x=el('button','trk');x.type='button';x.dataset.i=i;
      x.innerHTML='<b></b><span></span>';$('b',x).textContent=T.name;$('span',x).textContent=T.mood;
      x.onclick=()=>pick(i,true);li.append(x);ul.append(li);
    });
    sync();draw();
  }

  /* piano view */
  const WH=[60,62,64,65,67,69,71,72,74,76],WK=['a','s','d','f','g','h','j','k','l',';'];
  const BL=[[61,1,'w'],[63,2,'e'],[66,4,'t'],[68,5,'y'],[70,6,'u'],[73,8,'o'],[75,9,'p']];
  function viewPiano(){
    ui.title=ui.mood=ui.cv=ui.play=ui.msg=null;cancelAnimationFrame(raf);
    root.innerHTML=`<p class="mfine">Click the keys, or type on your keyboard: A to ; for white keys, W E T Y U O P for black keys.</p><div class="pkeys" tabindex="0" aria-label="Piano"></div><p class="mgift"></p>`;
    const keys=$('.pkeys',root),keyOf={};
    ui.msg=$('.mgift',root);
    function note(m){
      if(!ensure()){say('Sound is not available in this browser.');return}
      if(ctx.state==='suspended')ctx.resume();
      if(!pbus)pbus=makeBus();
      tone(mtof(m),ctx.currentTime,.25,{type:'triangle',att:.008,rel:.7,vol:.25,cut:3200,echo:.25,bus:pbus});
      const k=keyOf[m];if(k){k.classList.add('down');setTimeout(()=>k.classList.remove('down'),160)}
    }
    WH.forEach((m,i)=>{
      const k=el('button','wk');k.type='button';k.setAttribute('aria-label','Note '+m);k.innerHTML='<span></span>';$('span',k).textContent=WK[i].toUpperCase();
      k.onpointerdown=e=>{e.preventDefault();note(m)};keys.append(k);keyOf[m]=k;
    });
    BL.forEach(([m,idx,ch])=>{
      const k=el('button','bk');k.type='button';k.setAttribute('aria-label','Sharp note '+m);k.innerHTML='<span></span>';$('span',k).textContent=ch.toUpperCase();
      k.style.left=(idx*10-3)+'%';k.onpointerdown=e=>{e.preventDefault();e.stopPropagation();note(m)};keys.append(k);keyOf[m]=k;
    });
    const map={};WK.forEach((c,i)=>map[c]=WH[i]);BL.forEach(([m,,c])=>map[c]=m);
    keys.addEventListener('keydown',e=>{
      if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
      const m=map[e.key.toLowerCase()];if(m){e.preventDefault();note(m)}
    });
    if(!coarse)keys.focus();
  }

  function open(id){
    view=id;
    $$('.gtabs button').forEach(x=>{if(b.contains(x))x.setAttribute('aria-selected',x.dataset.id===id)});
    id==='play'?viewPlay():viewPiano();
  }
  [['play','Player'],['keys','Piano']].forEach(t=>{
    const x=el('button','gtab',t[1]);x.type='button';x.dataset.id=t[0];x.setAttribute('role','tab');x.onclick=()=>open(t[0]);tabs.append(x);
  });
  w.cleanup.push(()=>{clearInterval(timer);cancelAnimationFrame(raf);playing=false;if(ctx){try{ctx.close()}catch(e){}}});
  open('play');
}

  const tbody=$('tbody',b),S=k=>$(`[data-s=${k}]`,b);
  function draw(){
    const up=Math.floor((Date.now()-t0)/1000);
    S('up').textContent=up>=60?Math.floor(up/60)+'m '+up%60+'s':up+'s';
    S('win').textContent=wins.size;S('files').textContent=countFiles(FS);S('store').textContent=size(JSON.stringify(FS).length);
    tbody.innerHTML='';
    for(const x of wins.values()){
      const tr=el('tr','',`<td>${esc(APPS[x.app].title)}</td><td>${esc(x.title)}</td><td></td>`);
      if(x.id!==w.id){const e=el('button','btn','End');e.type='button';e.onclick=()=>{closeWin(x);draw()};$('td:last-child',tr).append(e)}
      else $('td:last-child',tr).textContent='this window';
      tbody.append(tr);
    }
  }
  draw();const iv=setInterval(draw,1000);w.cleanup.push(()=>clearInterval(iv));
}

function mountSettings(w,b){
  const accents=[['Blue','#2f6df6'],['Teal','#0f8b8d'],['Violet','#7c3aed'],['Green','#15803d'],['Ember','#c2410c']];
  const walls=[['tide','Tide'],['dusk','Dusk'],['moss','Moss'],['slate','Slate']];

  const G=k=>$(`[data-g=${k}]`,b);
  for(const [v,l] of [['auto','System'],['light','Light'],['dark','Dark']]){
    const x=el('button','btn',l);x.type='button';x.dataset.v=v;x.onclick=()=>{prefs.theme=v;applyPrefs();savePrefs();sync()};G('theme').append(x);
  }
  for(const [l,c] of accents){
    const x=el('button');x.type='button';x.dataset.v=c;x.style.background=c;x.setAttribute('aria-label',l);x.onclick=()=>{prefs.accent=c;applyPrefs();savePrefs();sync()};G('accent').append(x);
  }
  for(const [v,l] of walls){
    const x=el('button');x.type='button';x.dataset.v=v;x.style.background=`var(--wall-${v})`;x.setAttribute('aria-label',l+' wallpaper');x.title=l;x.onclick=()=>{prefs.wall=v;applyPrefs();savePrefs();sync()};G('wall').append(x);
  }
  function sync(){
    for(const k of ['theme','accent','wall'])for(const x of G(k).children)x.setAttribute('aria-pressed',x.dataset.v===prefs[k]);
  }
  $('[data-k=reset]',b).onclick=()=>{FS=defaultFS();changed()};
  sync();
}

/* accounts: stored in this browser only */
const ACCT='halcyon.acct',SESS='halcyon.sess';
const gate=$('#gate');
try{const a=JSON.parse(localStorage.getItem(ACCT)||'{}');if(a&&typeof a==='object'&&!Array.isArray(a))accts=a}catch(e){}
{const keys=Object.keys(accts),has=keys.some(k=>accts[k].rank==='owner');let dirty=false;
  keys.forEach((k,i)=>{const a=accts[k];if(!RANKS.some(r=>r[0]===a.rank)){a.rank='member';dirty=true}});
  if(dirty){try{localStorage.setItem(ACCT,JSON.stringify(accts))}catch(e){}}}
const reserved=k=>k==='__proto__'||k in Object.prototype;
function importCode(text,priv,by){
  let data;
  try{const t=text.trim();if(!t.startsWith('MMA1.'))throw 0;data=JSON.parse(atob(t.slice(5).replace(/\s+/g,'')))}catch(e){return{msg:'That is not a valid account code.'}}
  const list=data&&Array.isArray(data.a)?data.a:null;
  if(!list||!list.length||list.length>200)return{msg:'That code looks wrong.'};
  const has=Object.keys(accts).length>0;
  if(!priv){
    if(list.length!==1)return{msg:'You can import one account at a time. Ask a Co-owner or the Owner to import a code with several accounts.'};
    if(has&&sys.signups==='closed')return{msg:'Sign-ups are closed.'};
  }
  const pend=!priv&&has&&sys.signups==='approval';
  const B64=/^[A-Za-z0-9+/]+={0,2}$/,names=[];let added=0,skipped=0,bad=0;
  for(const x of list){
    if(!x||typeof x.name!=='string'||!/^[A-Za-z0-9._-]{2,24}$/.test(x.name)||typeof x.salt!=='string'||typeof x.hash!=='string'||x.iter!==150000||x.salt.length!==24||x.hash.length!==44||!B64.test(x.salt)||!B64.test(x.hash)){bad++;continue}
    const key=x.name.toLowerCase();
    if(reserved(key)||Object.prototype.hasOwnProperty.call(accts,key)){skipped++;continue}
    accts[key]={name:x.name,rank:'member',salt:x.salt,iter:150000,hash:x.hash};
    if(pend)accts[key].pending=true;
    names.push(x.name);added++;
  }
  if(added){
    try{localStorage.setItem(ACCT,JSON.stringify(accts))}catch(e){}
    logAct((by||'Someone')+' imported '+added+' account'+(added===1?'':'s')+(pend?' (waiting for approval)':''));
  }
  let msg;
  if(priv)msg='Imported '+added+'. Skipped '+skipped+' that already exist'+(bad?', and '+bad+' were invalid':'')+'.';
  else if(added)msg=pend?'Imported '+names[0]+'. It is waiting for approval from a Co-owner or the Owner.':'Imported '+names[0]+'. You can now sign in with your password.';
  else if(skipped)msg='That account already exists here. Sign in with it.';
  else msg='That code is not valid.';
  return{added,skipped,bad,pend,names,msg};
}
const OWN_SALT='fG90BUvE00L7ya8Z2efmVA==',OWN_HASH='+4und6KSFYlSLeCu05oAGUIedHamVGkPgKoS4sy6Yd8=',OWN_ITER=150000;
function refreshWho(){const x=$('.who',menu);x.innerHTML='Signed in as <b></b> ';$('b',x).textContent=acctName;x.append(rankBadge(uid))}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derive(pw,salt,iter){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256));
}
function boot(key){
  uid=key;acctName=accts[key].name;
  try{sessionStorage.setItem(SESS,key)}catch(e){}
  loadPrefs();loadFS();applyPrefs(false);
  $('.who',menu).innerHTML='Signed in as <b></b> ';$('.who b',menu).textContent=acctName;$('.who',menu).append(rankBadge(key));
  gate.hidden=true;gate.innerHTML='';
  applyName();renderIcons();showAnn();
  restart();
}
function signOut(){
  [...wins.values()].forEach(closeWin);
  try{sessionStorage.removeItem(SESS)}catch(e){}
  uid=null;acctName='';prefs={theme:'auto',accent:'#2f6df6',wall:'tide'};applyPrefs(false);
  renderIcons();showAnn();
  showGate('login');
}
function applyName(){const n=sys.osName;document.title=n;const m=$('#mark b');if(m)m.textContent=n;const sp=$('span',startBtn);if(sp)sp.textContent=n}
function showAnn(){
  const a=sys.ann,box=$('#ann');let seen='';
  try{seen=ls.getItem('halcyon.annseen')||''}catch(e){}
  if(!uid||!a||a.id===seen){box.hidden=true;return}
  box.hidden=false;box.innerHTML='<b></b><span class="at"></span><button type="button" class="btn">Dismiss</button>';
  $('b',box).textContent='Announcement from '+a.by;$('.at',box).textContent=a.t;
  $('button',box).onclick=()=>{try{ls.setItem('halcyon.annseen',a.id)}catch(e){}box.hidden=true};
}
function wipeAll(){
  [...wins.values()].forEach(closeWin);
  try{for(const k of Object.keys(localStorage))if(k.startsWith('halcyon.'))localStorage.removeItem(k)}catch(e){}
  try{sessionStorage.removeItem(SESS)}catch(e){}
  accts={};sys={osName:'MARSHMELLO',signups:'open',ann:null};uid=null;acctName='';fails=0;
  prefs={theme:'auto',accent:'#2f6df6',wall:'tide'};applyPrefs(false);applyName();renderIcons();showAnn();
  showGate('create');
}
let fails=0;
function showImport(){
  gate.hidden=false;closeMenu();
  gate.innerHTML=`<form class="gcard" novalidate><div class="glogo">${ic('logo',32)}</div><h2 id="gt"></h2><p class="gsub">Import your account.</p><label for="gc">Account code</label><textarea id="gc" placeholder="Paste your account code here" spellcheck="false"></textarea><p class="gerr" role="status"></p><button class="btn pri gbtn">Import account</button><button type="button" class="glink">Back to sign in</button><p class="gfine">Get the code with Export my account in Members on the browser where you made the account.</p></form>`;
  $('#gt',gate).textContent=sys.osName;
  const msg=$('.gerr',gate),ta=$('#gc',gate);
  $('.glink',gate).onclick=()=>showGate('login');
  $('form',gate).addEventListener('submit',e=>{
    e.preventDefault();const r=importCode(ta.value,false,'');
    msg.style.color=r.added?'var(--ok)':'var(--bad)';msg.textContent=r.msg;if(r.added)ta.value='';
  });
  setTimeout(()=>ta.focus(),30);
}
function showGate(mode){
  const has=Object.keys(accts).length>0;if(!has)mode='create';
  const mk=mode==='create';
  if(mk&&has&&sys.signups==='closed'){
    gate.hidden=false;closeMenu();
    gate.innerHTML=`<div class="gcard"><div class="glogo">${ic('logo',32)}</div><h2 id="gt"></h2><p class="gsub">Sign-ups are closed.</p><p class="gfine" style="margin:0 0 8px">A Co-owner or the Owner has closed new sign-ups. Sign in if you already have an account.</p><button type="button" class="btn pri gbtn">Sign in</button></div>`;
    $('#gt',gate).textContent=sys.osName;$('.gbtn',gate).onclick=()=>showGate('login');return;
  }
  gate.hidden=false;closeMenu();
  gate.innerHTML=`<form class="gcard" novalidate><div class="glogo">${ic('logo',32)}</div><h2 id="gt"></h2><p class="gsub">${mk?'Create an account to enter.':'Sign in to enter.'}</p><label for="gu">Username</label><input id="gu" autocomplete="username" maxlength="24" spellcheck="false" autocapitalize="off"><label for="gp">Password</label><input id="gp" type="password" autocomplete="${mk?'new-password':'current-password'}">${mk?'<label for="gp2">Confirm password</label><input id="gp2" type="password" autocomplete="new-password">':''}<p class="gerr" role="alert"></p><button class="btn pri gbtn">${mk?'Create account':'Sign in'}</button>${has?`<button type="button" class="glink">${mk?'I already have an account':'Create a new account'}</button>`:''}<button type="button" class="glink gimp">I have an account code</button><p class="gfine">Accounts are saved in this browser only. This keeps casual visitors out, but it is not secure: anyone using this browser profile can clear it.</p></form>`;
  $('#gt',gate).textContent=sys.osName;
  const f=$('form',gate),err=$('.gerr',gate),u=$('#gu',gate),p=$('#gp',gate),p2=$('#gp2',gate),btn=$('.gbtn',gate);
  const lk=$('.glink:not(.gimp)',gate);if(lk)lk.onclick=()=>showGate(mk?'login':'create');
  $('.gimp',gate).onclick=()=>showImport();
  setTimeout(()=>{const a=document.activeElement;if(!a||a===document.body||!gate.contains(a))u.focus()},30);
  f.addEventListener('submit',async e=>{
    e.preventDefault();err.textContent='';
    const name=u.value.trim(),pw=p.value,key=name.toLowerCase();
    if(!window.crypto||!crypto.subtle){err.textContent='This browser cannot protect passwords here. Open the page over https.';return}
    if(!/^[A-Za-z0-9._-]{2,24}$/.test(name)){err.textContent='Username must be 2 to 24 letters, numbers, dots, dashes or underscores.';u.focus();return}
    if(mk&&reserved(key)){err.textContent='That username is not available.';u.focus();return}
    btn.disabled=true;
    try{
      if(mk){
        if(pw.length<8){err.textContent='Password must be at least 8 characters.';p.focus();return}
        if(pw!==p2.value){err.textContent='The passwords do not match.';p2.focus();return}
        if(Object.keys(accts).length>0&&sys.signups==='closed'){err.textContent='Sign-ups are closed.';return}
        if(Object.prototype.hasOwnProperty.call(accts,key)){err.textContent='That username is taken. Pick another or sign in.';u.focus();return}
        const salt=crypto.getRandomValues(new Uint8Array(16)),iter=150000;
        const first=Object.keys(accts).length===0,pend=!first&&sys.signups==='approval';
        accts[key]={name,rank:'member',salt:b64(salt),iter,hash:await derive(pw,salt,iter)};
        if(pend)accts[key].pending=true;
        try{localStorage.setItem(ACCT,JSON.stringify(accts))}catch(x){delete accts[key];err.textContent='Could not save the account. Browser storage seems to be blocked.';return}
        if(first){
          try{for(const k of Object.keys(localStorage)){if(k.startsWith('halcyon.')&&!k.startsWith('halcyon.u.')&&k!==ACCT&&k!==SESS&&localStorage.getItem('halcyon.u.'+key+'.'+k)===null)localStorage.setItem('halcyon.u.'+key+'.'+k,localStorage.getItem(k))}}catch(x){}
        }
        if(pend){
          logAct('New account '+name+' is waiting for approval');
          gate.innerHTML=`<div class="gcard"><div class="glogo">${ic('logo',32)}</div><h2 id="gt"></h2><p class="gsub">Account created.</p><p class="gfine" style="margin:0 0 8px">A Co-owner or the Owner needs to approve it before you can enter.</p><button type="button" class="btn pri gbtn">Back to sign in</button></div>`;
          $('#gt',gate).textContent=sys.osName;$('.gbtn',gate).onclick=()=>showGate('login');return;
        }
        boot(key);
      }else{
        const a=Object.prototype.hasOwnProperty.call(accts,key)?accts[key]:null;
        const ok=a&&(await derive(pw,unb64(a.salt),a.iter))===a.hash;
        if(!ok){
          fails++;err.textContent='Wrong username or password.';p.value='';p.focus();
          await new Promise(r=>setTimeout(r,Math.min(5000,fails*600)));
          return;
        }
        if(accts[key].banned){err.textContent='This account has been banned.';p.value='';return}
        if(accts[key].pending){err.textContent='Your account is waiting for approval from a Co-owner or the Owner.';p.value='';return}
        fails=0;boot(key);
      }
    }catch(x){err.textContent='Something went wrong. Try again.'}
    finally{if(btn.isConnected)btn.disabled=false}
  });
}

if(sess&&Object.prototype.hasOwnProperty.call(accts,sess)&&!accts[sess].banned&&!accts[sess].pending)boot(sess);else showGate('login');
